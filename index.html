/* ======================================================================
   Design tokens
   ====================================================================== */
:root {
  --paper: #F2F4F3;
  --surface: #FFFFFF;
  --ink: #17242E;
  --muted: #5B6B76;
  --rule: #D5DCDF;
  --band: #E6EBEC;
  --accent: #0F766E;          /* Global：青綠 */
  --accent-soft: #D3ECE9;
  --accent-ink: #FFFFFF;
  --warn: #9A5B00;
  --warn-soft: #FBEBD0;
  --danger: #A8233A;
  --danger-soft: #F7DCE1;
  --font: "IBM Plex Sans", "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans CJK TC", "Noto Sans TC", "Source Han Sans TC", system-ui, sans-serif;
  --r-sm: 4px;
  --r-md: 8px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12191E; --surface: #1A2329; --ink: #E4EAED; --muted: #94A3AC;
    --rule: #2E3B43; --band: #24313A; --accent: #2DB3A7; --accent-soft: #163C3A; --accent-ink: #08201E;
    --warn: #E8B15A; --warn-soft: #3A2C14; --danger: #F07A8E; --danger-soft: #3D1A21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12191E; --surface: #1A2329; --ink: #E4EAED; --muted: #94A3AC;
  --rule: #2E3B43; --band: #24313A; --accent: #2DB3A7; --accent-soft: #163C3A; --accent-ink: #08201E;
  --warn: #E8B15A; --warn-soft: #3A2C14; --danger: #F07A8E; --danger-soft: #3D1A21;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--font); font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ======================================================================
   Header
   ====================================================================== */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.top-inner {
  max-width: 1360px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-right: auto; display: flex; gap: 10px; align-items: center; }
.brand svg { color: var(--accent); flex: none; }
.icon-btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-md);
  padding: 6px 10px; cursor: pointer; font-size: 14px;
}
.icon-btn:hover { border-color: var(--muted); }

/* ======================================================================
   Spectrum ruler (hero)
   ====================================================================== */
.spectrum { max-width: 1360px; margin: 0 auto; padding: 20px 20px 8px; }
.spectrum-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.spectrum-head h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
.spectrum-head p { margin: 0; color: var(--muted); font-size: 13px; }
.ruler-scroll { overflow-x: auto; padding-bottom: 4px; }
.ruler { position: relative; min-width: 720px; margin: 0 18px; }
.scroll-hint { display: none; font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.lanes { position: relative; }
.band-btn {
  position: absolute; height: 26px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: var(--r-sm); font-size: 12px; padding: 0 6px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: clip; text-align: left; color: var(--ink);
}
.band-btn:hover { border-color: var(--accent); }
.band-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.band-btn.custom { border-style: dashed; }
.axis { position: relative; height: 22px; border-top: 1px solid var(--ink); margin-top: 6px; }
.axis span { position: absolute; top: 4px; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
.axis span::before { content: ""; position: absolute; left: 50%; top: -5px; height: 5px; border-left: 1px solid var(--ink); }
.custom-range { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--muted); }
.custom-range input { width: 88px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); }
.need-summary { font-size: 13px; color: var(--ink); }
.need-summary b { color: var(--accent); }

/* ======================================================================
   Layout
   ====================================================================== */
.layout {
  max-width: 1360px; margin: 0 auto; padding: 12px 20px 40px;
  display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 24px; align-items: start;
}
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto; padding-right: 4px; }
.filters-head { display: none; }
.fgroup { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.fgroup:first-child { padding-top: 0; }
.fgroup > .ftitle { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; }
.fgroup details summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.fgroup details summary::-webkit-details-marker { display: none; }
.fgroup details summary::after { content: "+"; color: var(--muted); }
.fgroup details[open] summary::after { content: "−"; }
.fgroup details[open] summary { margin-bottom: 8px; }
.sel-count { color: var(--accent); font-weight: 600; margin-left: 6px; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip small { color: var(--muted); font-size: 11px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip[aria-pressed="true"] small { color: var(--ink); }
.chip:disabled { opacity: .45; cursor: default; }
.checks { display: grid; gap: 2px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }
.checks label small { margin-left: auto; color: var(--muted); }
.checks input { accent-color: var(--accent); }
.checks label.zero { color: var(--muted); }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; cursor: pointer; }
.toggle input { accent-color: var(--accent); }
select.module {
  width: 100%; padding: 9px 10px; border: 1px solid var(--accent); border-radius: var(--r-md);
  background: var(--surface); font-weight: 600;
}
.module-hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.reset { margin-top: 14px; width: 100%; }

/* ======================================================================
   Results
   ====================================================================== */
.results-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.count { font-size: 15px; }
.count b { font-size: 20px; font-weight: 700; }
.results-bar .spacer { flex: 1; }
.results-bar select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); font-size: 13px; }
.mobile-filter-btn { display: none; }
.active-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.active-tags button {
  border: none; background: var(--accent-soft); color: var(--ink); border-radius: var(--r-sm);
  padding: 3px 8px; font-size: 12px; cursor: pointer;
}
.active-tags button::after { content: " ×"; color: var(--muted); }

.list { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; }
.row {
  display: grid; grid-template-columns: 64px minmax(0, 1.25fr) minmax(200px, 1fr) minmax(0, .9fr);
  gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule);

}
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.thumb {
  width: 64px; height: 64px; border-radius: var(--r-sm); background: #fff; display: grid; place-items: center; overflow: hidden;
  border: 1px solid var(--rule);
}
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.thumb svg { color: #9AA8B0; }
.oc { font-weight: 700; font-size: 15px; letter-spacing: .01em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pname { color: var(--muted); font-size: 13px; margin-top: 2px; line-height: 1.4; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-sm); background: var(--band); color: var(--ink); }
.badge.jp { background: var(--danger-soft); color: var(--danger); }
.badge.cert { background: var(--accent); color: var(--accent-ink); }
.badge.cert.hit { outline: 2px solid var(--ink); outline-offset: 1px; }
.module-info { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: -2px 0 0; }
.module-info b { color: var(--ink); }
.cert-group { display: grid; gap: 6px; }
.cert-group + .cert-group { margin-top: 10px; }
.cert-group h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.mod-list span small { opacity: .75; margin-left: 4px; }
.badge.np { background: var(--band); color: var(--muted); }
.badge.nrnd { background: var(--warn-soft); color: var(--warn); }
.badge.eol { background: var(--danger-soft); color: var(--danger); }
.strip { position: relative; height: 14px; background: var(--band); border-radius: 2px; }
.strip i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 1px; min-width: 2px; }
.strip b { position: absolute; top: -3px; bottom: -3px; border: 1px solid var(--ink); border-radius: 2px; opacity: .55; }
.freq-text { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; font-size: 12px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.specs div { min-width: 0; }
.specs .dim { grid-column: 1 / -1; }
.specs .dim dd { font-weight: 600; }
.size-filter { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.size-filter input { width: 90px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); }
.size-filter input.active { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.size-hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

.empty { padding: 48px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
.more { display: block; margin: 12px auto 0; }
.more[hidden] { display: none; }
/* Datasheet 按鈕 (不顯示網址) */
.ds-btn {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--accent); color: var(--accent);
  background: var(--surface); border-radius: var(--r-sm); padding: 2px 8px; font-size: 12px; font-weight: 600; cursor: pointer;
}
.ds-btn:hover { background: var(--accent); color: var(--accent-ink); }
.ds-btn.lg { padding: 6px 12px; font-size: 14px; border-radius: var(--r-md); }
html.offline .ds-btn { opacity: .5; }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ======================================================================
   Detail dialog
   ====================================================================== */
dialog.detail {
  width: min(880px, calc(100vw - 24px)); max-height: calc(100% - 48px); padding: 0;
  border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); color: var(--ink);
}
dialog.detail::backdrop { background: rgba(10, 18, 24, .5); }
.d-head { display: grid; grid-template-columns: 140px 1fr auto; gap: 20px; padding: 20px; border-bottom: 1px solid var(--rule); align-items: start; }
.d-head .thumb { width: 140px; height: 140px; }
.d-head h2 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.d-head p { margin: 4px 0 0; color: var(--muted); }
.d-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.d-body { padding: 16px 20px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.d-body > * { min-width: 0; }
.d-body h3 { font-size: 14px; margin: 0 0 8px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 20px; margin: 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-md); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; white-space: pre-line; }
th { color: var(--muted); font-weight: 500; background: var(--paper); }
tr:last-child td { border-bottom: 0; }
.mod-list { display: flex; flex-wrap: wrap; gap: 6px; }
.mod-list span { font-size: 12px; padding: 3px 8px; border-radius: var(--r-sm); background: var(--band); }
.mod-list span.hit { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.link-btn { background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; font-weight: 600; }
.notice { font-size: 13px; padding: 10px 12px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--ink); }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: var(--r-md); font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
}
.toast.show { opacity: 1; }
footer { max-width: 1360px; margin: 0 auto; padding: 0 20px 32px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

/* ======================================================================
   Responsive
   ====================================================================== */
@media (max-width: 1080px) {
  .row { grid-template-columns: 56px minmax(0, 1fr) minmax(160px, 1fr); }
  .row .specs { grid-column: 2 / -1; }
  .thumb { width: 56px; height: 56px; }
}
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .filters {
    position: fixed; inset: 0 0 0 auto; width: min(360px, 92vw); max-height: none; z-index: 40;

  .filters.open { transform: none; box-shadow: -12px 0 32px rgba(0, 0, 0, .18); }

  .scrim { position: fixed; inset: 0; background: rgba(10, 18, 24, .4); z-index: 39; }

  .d-head { grid-template-columns: 96px 1fr; }
  .d-head .thumb { width: 96px; height: 96px; }
  .d-head .close-wrap { grid-column: 1 / -1; grid-row: 1; justify-self: end; }
  .spectrum-head h1 { font-size: 19px; }
  .scroll-hint { display: block; }
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function connFamily(s) {
  if (!s) return NONE;
  const x = s.toLowerCase();
  if (x.includes('fakra')) return 'FAKRA';
  if (x.includes('rp') && x.includes('sma')) return 'RP-SMA';
  if (x.includes('sma')) return 'SMA';
  if (x.includes('mhf4')) return 'IPEX MHF4';
  if (x.includes('mhf1') || x.includes('u.fl')) return 'IPEX MHF1 / U.FL';
  if (x.includes('mhf') || x.includes('ipex')) return 'IPEX';
  if (x.includes('n type') || x.includes('n-type')) return 'N type';
  if (x.includes('tnc')) return 'TNC';
  if (x.includes('mcx')) return 'MCX';
  if (x.includes('4.3') || x.includes('7/16')) return '4.3-10 / 7/16 DIN';
  return s;
}
function mountNorm(s) {
  if (!s) return NA;
  const m = s.replace(/\s*Mount$/i, '').trim();
  return /^sm[dt]$/i.test(m) ? 'SMT' : m;
}
const TYPE_LABEL = { WIFI: 'Wi-Fi', 'UWB chip': 'UWB' };
const typeLabel = (x) => TYPE_LABEL[x] || x || OTHER;

function firstNum(s) {
  const m = String(s ?? '').match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
const spanOf = (p) => (p.ranges || []).reduce((a, [lo, hi]) => a + (hi - lo), 0);
/** 產品頻率區間是否完整涵蓋需求頻段 */
const covers = (ranges, lo, hi) => (ranges || []).some(([a, b]) => a <= lo + 0.01 && b >= hi - 0.01);
/** 對數刻度：頻率 → 百分比位置 */
function xPct(f) {
  const c = Math.min(Math.max(f, F_MIN), F_MAX);
  return ((Math.log(c) - Math.log(F_MIN)) / (Math.log(F_MAX) - Math.log(F_MIN))) * 100;
}

    if (cfg.module && skipKey !== '__module' && state.module && !(p.certs || []).includes(state.module)) return false;
    for (const x of cfg.toggles) if (state.toggles[x.key] && !x.test(p)) return false;
    for (const f of cfg.facets) {
      if (f.key === skipKey) continue;
      const sel = state.sel[f.key];
      if (sel && sel.length && !asArr(f.get(p)).some((v) => sel.includes(v))) return false;
    }
    for (const n of needs) if (!covers(p.ranges, n.lo, n.hi)) return false;
    if (state.maxL && !(p.dimL != null && p.dimL <= state.maxL)) return false;
    if (q) {
      const hay = [p.oc, p.name, p.desc, p.freq, p.form, p.atype, p.dim, p.replace, (p.certs || []).join(' ')]
        .join(' ').toLowerCase();
      if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  });
}
function sorted(list) {
  const arr = list.slice();
  if (state.sort === 'gain') {
    const g = (p) => firstNum(p.techs?.[0]?.gain) ?? -99;
    arr.sort((a, b) => g(b) - g(a));
  } else if (state.sort === 'span') {
    arr.sort((a, b) => spanOf(b) - spanOf(a));
  } else if (state.sort === 'size') {
    arr.sort((a, b) => (a.dimL ?? Infinity) - (b.dimL ?? Infinity));
  } else {
    arr.sort((a, b) => a.oc.localeCompare(b.oc));
  }
  // 選定模組時，已認證的天線本來就全部符合；未選模組時有 TELEC 認證者排前面 (穩定排序)
  if (!state.module) arr.sort((a, b) => ((b.certs || []).length > 0) - ((a.certs || []).length > 0));
  return arr;
}
function counts(facet) {
  const m = new Map();
  for (const p of filterItems(facet.key)) for (const v of new Set(asArr(facet.get(p)))) m.set(v, (m.get(v) || 0) + 1);
  return m;
}
function allValues(facet) {
  const set = new Set();
  for (const p of PAGES[page].items()) asArr(facet.get(p)).forEach((v) => set.add(v));
  const arr = [...set];
  if (facet.sort) return arr.sort(facet.sort);
  // 特殊代號 (未標示/無/其他) 排最後
  return arr.sort((a, b) => (a.startsWith('__') - b.startsWith('__')) || String(a).localeCompare(String(b)));
}

function renderRuler() {
  const lanes = [];
  const bands = BANDS[page].map((b) => ({ ...b, text: bandLabel(b), custom: false }))
    .concat(state.custom.map((c, i) => ({ id: 'custom-' + i, text: `${c.lo}–${c.hi}`, lo: c.lo, hi: c.hi, custom: true })));
  const MIN_W = 8.5;   // 按鈕最小寬度 (%)，以容納文字
  const placed = bands.map((b) => {
    const x1 = xPct(b.lo), x2 = Math.max(xPct(b.hi), x1 + MIN_W);
    let lane = lanes.findIndex((right) => right <= x1 - 0.3);
    if (lane === -1) { lane = lanes.length; lanes.push(0); }
    lanes[lane] = x2;
    return { ...b, x1, x2, lane };
  });
  const laneH = 30;
  $('lanes').style.height = lanes.length * laneH + 'px';
  $('lanes').innerHTML = placed.map((b) => {
    const pressed = b.custom || state.bands.includes(b.id);
    const title = t('bandTitle', { l: b.text, lo: b.lo, hi: b.hi }) + (b.custom ? t('bandRemove') : '');
    return `<button type="button" class="band-btn${b.custom ? ' custom' : ''}" data-band="${b.id}" aria-pressed="${pressed}"
      title="${esc(title)}" style="left:${b.x1}%;width:${b.x2 - b.x1}%;top:${b.lane * laneH}px">${esc(b.text)}</button>`;
  }).join('');
  $('axis').innerHTML = AXIS_TICKS.map((f) => `<span style="left:${xPct(f)}%">${f >= 1000 ? f / 1000 + 'G' : f + 'M'}</span>`).join('');
  const n = allNeeds().length;
  $('needSummary').innerHTML = n ? t('needN', { n }) : esc(t('noNeed'));
}

/** 比較語意化版本：a > b 回傳正數 */
function cmpVer(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
  return 0;
}
/** 讀取伺服器上的 version.json (不經快取)；失敗回傳 null */
async function fetchLatest() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    return j.version ? j : null;
  } catch { return null; }
}
async function checkForUpdate() {
  const latest = await fetchLatest();
  const has = !!latest && cmpVer(latest.version, APP_VERSION) > 0;
  $('updateBtn').classList.toggle('has-update', has);
  if (has) toast(t('newVersion', { v: latest.version }), 5000);
  return latest;
}
async function openVersion() {

    $('verDialog').innerHTML = `

          <dt>${esc(t('v_built'))}</dt><dd>${esc(DATA.built || '—')}</dd>
          <dt>${esc(t('v_sw'))}</dt><dd>${esc(t(swActive ? 'swOn' : 'swOff'))}</dd>
          <dt>${esc(t('v_mode'))}</dt><dd>${esc(t(isStandalone() ? 'modeApp' : 'modeBrowser'))}</dd>
          <dt>${esc(t('v_storage'))}</dt><dd>${esc(t(persisted ? 'persistOn' : 'persistOff'))}</dd>
          <dt>${esc(t('v_src'))}</dt><dd>${esc(DATA.source)}</dd>
          <dt>${esc(t('v_rev'))}</dt><dd>${esc([DATA.revision?.rev, DATA.revision?.date].filter(Boolean).join(' · ') || '—')}</dd>
          <dt>${esc(t('v_count'))}</dt><dd>${esc(t('v_countVal', { a: DATA.items.length, m: DATA.modules.length, c: DATA.items.reduce((n, p) => n + (p.certs || []).length, 0) }))}</dd>
        </dl>
        <button type="button" class="icon-btn" data-force>${esc(t('update'))}</button>
      </div>`;
  };

/**
 * 強制更新：
 * 1. 請等待中的新版 Service Worker 立即啟用
 * 2. 解除註冊所有 Service Worker、刪除所有 Cache Storage
 * 3. 以帶時間戳記的網址重新載入，繞過 HTTP 快取
 */
async function forceUpdate() {
  // 離線或伺服器無回應時絕不清除快取，否則 App 將無法開啟
  if (!navigator.onLine) { toast(t('offlineNoUpdate'), 3500); return; }
  $('updateBtn').classList.add('spin');
  const latest = await fetchLatest();
  if (!latest && location.protocol !== 'file:') {
    $('updateBtn').classList.remove('spin');
    toast(t('serverUnreachable'), 3500);
    return;
  }
  toast(t('updating'));
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      regs.forEach((r) => r.waiting?.postMessage('SKIP_WAITING'));
      await Promise.all(regs.map((r) => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch { /* 部分環境不允許存取，仍繼續重新載入 */ }
  const url = new URL(location.href);
  url.searchParams.set('v', Date.now());
  setTimeout(() => location.replace(url.toString()), 400);
}

/* ==========================================================================
   App 化：安裝、離線狀態、永久儲存
   ========================================================================== */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const platform = (() => {
  const ua = navigator.userAgent;
  if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  return 'desktop';
})();
let deferredPrompt = null;   // Android / Windows Chrome、Edge 的安裝事件

function refreshInstallBtn() {
  // 已安裝則隱藏；iOS 沒有安裝事件，改顯示說明
  $('installBtn').hidden = isStandalone() || (!deferredPrompt && platform !== 'ios' && !$('installBtn').dataset.manual);
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  refreshInstallBtn();
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  refreshInstallBtn();
  toast(t('installed'), 3500);
});
$('installBtn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice.catch(() => null);
    deferredPrompt = null;
    refreshInstallBtn();
    return;
  }
  openInstallHelp();
});
function openInstallHelp() {
  const key = platform === 'ios' ? 'iosSteps' : platform === 'android' ? 'androidSteps' : 'desktopSteps';
  const url = appUrl();
  // 步驟字串為內建常數 (含少量 HTML 標記)，非使用者輸入
  $('installDialog').innerHTML = `
    <div class="d-simple-head"><h2 id="installTitle">${esc(t('installTitle'))}</h2>
      <button type="button" class="icon-btn" data-close>${esc(t('close'))}</button></div>
    <div class="d-body">
      <ol class="steps">${(I18N[lang]?.[key] ?? I18N.en[key]).map((x) => `<li>${x}</li>`).join('')}</ol>
      ${url ? `<div class="web-link">
        <div class="acts">
          <button type="button" class="primary" data-open-web>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>${esc(t('openWeb'))}</button>
          <button type="button" class="icon-btn" data-copy-link>${esc(t('copyLink'))}</button>
        </div>
        <p class="addr">${esc(url)}</p>
        <p class="hint">${esc(t('webHint'))}</p>
      </div>` : ''}
      <p class="notice">${esc(t('installNote'))}</p>
    </div>`;
  if (!$('installDialog').open) $('installDialog').showModal();
}
$('installDialog').addEventListener('click', (e) => {
  if (e.target === $('installDialog') || e.target.closest('[data-close]')) { $('installDialog').close(); return; }
  // 開啟網頁：另開分頁 (App 內建瀏覽器多半會交給系統瀏覽器)
  if (e.target.closest('[data-open-web]')) { window.open(appUrl(), '_blank', 'noopener'); return; }
  if (e.target.closest('[data-copy-link]')) copyText(appUrl(), t('linkCopied'));
});

/** 離線狀態：標示於頂部，並在恢復連線時檢查新版 */
function setNet() {
  document.documentElement.classList.toggle('offline', !navigator.onLine);
}
window.addEventListener('offline', setNet);
window.addEventListener('online', () => { setNet(); toast(t('backOnline')); checkForUpdate(); });

/** 申請永久儲存 (降低 iOS / Android 清除離線快取的機會) */
let persisted = false;
async function requestPersist() {
  try {
    if (navigator.storage?.persisted) persisted = await navigator.storage.persisted();
    if (!persisted && navigator.storage?.persist) persisted = await navigator.storage.persist();
  } catch { /* 不支援時忽略 */ }
}

/* ==========================================================================
   主題 (深色 / 淺色)
   ========================================================================== */
const ICON_MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
const ICON_SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const isDark = () => (document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === 'dark'
  : matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(th) {
  if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
  renderThemeBtn();
}
function renderThemeBtn() {
  const dark = isDark();
  // 按鈕顯示「切換目標」
  $('themeIcon').innerHTML = dark ? ICON_SUN : ICON_MOON;
  $('themeLbl').textContent = t(dark ? 'themeLight' : 'themeDark');
  $('themeBtn').setAttribute('aria-label', t(dark ? 'themeAriaLight' : 'themeAriaDark'));
}

/* ==========================================================================
   事件
   ========================================================================== */
function toast(msg, ms = 1800) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms);
}
async function copyText(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch { toast(t('clipFail')); }
    ta.remove();
  }
}
function update() { shown = PAGE_SIZE; renderAll(); }

$('lanes').addEventListener('click', (e) => {
  const b = e.target.closest('[data-band]'); if (!b) return;
  const id = b.dataset.band;
  if (id.startsWith('custom-')) state.custom.splice(+id.slice(7), 1);
  else state.bands = state.bands.includes(id) ? state.bands.filter((x) => x !== id) : state.bands.concat(id);
  update();
});
$('cAdd').addEventListener('click', () => {
  let lo = parseFloat($('cLo').value), hi = parseFloat($('cHi').value);
  if (!isFinite(lo) || !isFinite(hi) || lo <= 0 || hi <= 0) { toast(t('invalidFreq')); return; }
  if (lo > hi) [lo, hi] = [hi, lo];
  state.custom.push({ lo, hi });
  $('cLo').value = ''; $('cHi').value = '';
  update();
});
[$('cLo'), $('cHi')].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('cAdd').click(); }));

$('quick').addEventListener('change', (e) => {
  const key = e.target.dataset.quick; if (!key) return;
  if (key === '__module') state.module = e.target.value;
  else state.sel[key] = e.target.value ? [e.target.value] : [];
  update();
});

let qTimer;
$('filterBody').addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    state.q = e.target.value;
    clearTimeout(qTimer); qTimer = setTimeout(update, 150);
  } else if (e.target.id === 'maxL') {
    const v = parseFloat(e.target.value);
    state.maxL = isFinite(v) && v > 0 ? v : null;
    clearTimeout(qTimer); qTimer = setTimeout(update, 250);
  }
});
$('filterBody').addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.toggle) { state.toggles[el.dataset.toggle] = el.checked; update(); return; }
  if (el.dataset.facet && el.type === 'checkbox') toggleSel(el.dataset.facet, el.dataset.val);
});
$('filterBody').addEventListener('click', (e) => {
  const c = e.target.closest('button.chip'); if (c) toggleSel(c.dataset.facet, c.dataset.val);
});
function toggleSel(key, val) {
  const cur = state.sel[key] || [];
  state.sel[key] = cur.includes(val) ? cur.filter((v) => v !== val) : cur.concat(val);
  update();
}
$('activeTags').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tag]'); if (!b) return;
  const x = JSON.parse(b.dataset.tag);
  if (x.act === 'module') state.module = '';
  if (x.act === 'facet') state.sel[x.f] = (state.sel[x.f] || []).filter((v) => v !== x.v);
  if (x.act === 'band') state.bands = state.bands.filter((id) => id !== x.id);
  if (x.act === 'custom') state.custom.splice(x.i, 1);
  if (x.act === 'size') state.maxL = null;
  update();
});
function resetAll() { state = freshState(page); $('sortSel').value = state.sort; update(); }
$('resetBtn').addEventListener('click', resetAll);
$('sortSel').addEventListener('change', (e) => { state.sort = e.target.value; update(); });
$('moreBtn').addEventListener('click', () => { shown += PAGE_SIZE; renderList(); });
$('copyBtn').addEventListener('click', () => {
  if (!lastResults.length) { toast(t('noResults')); return; }
  copyText(lastResults.map((p) => p.oc).join('\n'), t('copiedN', { n: lastResults.length }));
});
$('list').addEventListener('click', (e) => {
  if (e.target.closest('[data-act="reset"]')) { resetAll(); return; }
  const ds = e.target.closest('[data-ds]');
  if (ds) { e.stopPropagation(); openDatasheet(ds.dataset.ds); return; }
  const r = e.target.closest('[data-oc]'); if (r) openDetail(r.dataset.oc);
});
// 鍵盤：在列上按 Enter / 空白鍵開啟詳細規格
$('list').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('row')) {
    e.preventDefault(); openDetail(e.target.dataset.oc);
  }
});
$('detail').addEventListener('click', (e) => {
  if (e.target === $('detail') || e.target.closest('[data-close]')) { $('detail').close(); return; }
  const c = e.target.closest('[data-copy]'); if (c) { copyText(c.dataset.copy, t('copied', { oc: c.dataset.copy })); return; }
  const ds = e.target.closest('[data-ds]'); if (ds) { openDatasheet(ds.dataset.ds); return; }
  const g = e.target.closest('[data-goto]');
  if (g) {
    const oc = g.dataset.goto;
    if (PAGES[page].items().some((x) => x.oc === oc)) openDetail(oc);
    else { $('detail').close(); state.q = oc; update(); toast(t('notOnPage')); }
  }
});
$('verDialog').addEventListener('click', (e) => {
  if (e.target === $('verDialog') || e.target.closest('[data-close]')) { $('verDialog').close(); return; }
  if (e.target.closest('[data-force]')) forceUpdate();
});

/* 頂部工具列 */
$('langSel').addEventListener('change', (e) => {
  lang = LANGS.includes(e.target.value) ? e.target.value : DEFAULT_LANG;
  store.set('lang', lang);
  applyStaticI18n(); renderPageText(); renderAll();
  if ($('verDialog').open) openVersion();
  if ($('installDialog').open) openInstallHelp();
});
$('themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  applyTheme(next); store.set('theme', next);
});
$('updateBtn').addEventListener('click', forceUpdate);
$('verBtn').addEventListener('click', openVersion);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', renderThemeBtn);

/* 手機版篩選抽屜 */
let scrim;
function setFilters(open) {
  $('filters').classList.toggle('open', open);
  if (open && !scrim) { scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.onclick = () => setFilters(false); document.body.appendChild(scrim); }
  if (!open && scrim) { scrim.remove(); scrim = null; }
}
$('openFilters').addEventListener('click', () => setFilters(true));
$('closeFilters').addEventListener('click', () => setFilters(false));

/* ==========================================================================
   路由與初始化
   ========================================================================== */
function route() {
  // v3 起為單一頁面；舊連結 (#/global、#/japan) 一律導向主畫面
  page = 'main';
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  state = Object.assign(freshState(page), store.load(page) || {});
  if (state.module && !DATA.modules.some((m) => m.name === state.module)) state.module = '';
  if (state.toggles?.jpOnly) { state.sel.jp = ['Yes']; }
  if (state.toggles) delete state.toggles.jpOnly;
  $('sortSel').value = state.sort;
  renderPageText();
  setFilters(false);
  update();
}

const savedLang = store.get('lang');
lang = LANGS.includes(savedLang) ? savedLang : DEFAULT_LANG;
const savedTheme = store.get('theme');
applyTheme(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : null);
applyStaticI18n();
setNet();
// iOS 不支援安裝事件：未安裝時直接顯示「安裝 App」按鈕 (開啟說明)
if (platform === 'ios') $('installBtn').dataset.manual = '1';
refreshInstallBtn();
route();

/* Service Worker：僅在 https / localhost 註冊；偵測到新版即提示 */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      requestPersist();
      // 第一次安裝完成 (全部檔案已快取) 時提示可離線使用
      if (!navigator.serviceWorker.controller) {
        navigator.serviceWorker.addEventListener('controllerchange', () => toast(t('offlineReady'), 2500), { once: true });
      }
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw?.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) $('updateBtn').classList.add('has-update');
        });
      });
    }).catch(() => { /* 無 sw.js (例如預覽環境) 時忽略 */ });
  });
}
// 啟動後檢查 version.json (失敗時安靜略過)
setTimeout(checkForUpdate, 1500);
</script>
