/* 工具內的「使用說明」按鈕：在全螢幕視窗中顯示目前語言的使用說明 */
function openGuide() {
  const dlg = $('guideDialog');
  $('guideTitle').textContent = t('guide');
  $('guidePrint').textContent = t('guidePrint');
  $('guideClose').textContent = t('close');
  $('guidePrint').disabled = true;
  $('guideFrame').title = t('guide');
  $('guideFrame').src = `${location.pathname}?guide=1&lang=${lang}`;
  if (!dlg.open) dlg.showModal();
}
function closeGuide() {
  $('guideDialog').close();
  $('guideFrame').src = 'about:blank';   // 釋放記憶體
}
if (MODE === 'app') {
  // 移遠天線 Agent：離線時不開啟空白頁，改為提示
  $('agentBtn').addEventListener('click', (e) => { if (!navigator.onLine) { e.preventDefault(); toast(t('agentOffline'), 3000); } });
  window.addEventListener('message', (e) => {
    if (e.origin === location.origin && e.data?.type === 'guide-ready') $('guidePrint').disabled = false;
  });
  $('guideBtn').addEventListener('click', openGuide);
  $('guideClose').addEventListener('click', closeGuide);
  $('guideDialog').addEventListener('cancel', (e) => { e.preventDefault(); closeGuide(); });
  $('guidePrint').addEventListener('click', () => { try { $('guideFrame').contentWindow.print(); } catch { /* 忽略 */ } });
}

/* ==========================================================================
   路由與初始化
   ========================================================================== */
function route() {
  // v3 起為單一頁面；舊連結 (#/global、#/japan) 一律導向主畫面
  page = 'main';
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  state = Object.assign(freshState(page), MODE === 'app' ? (store.load(page) || {}) : {});
  // v3.18 起模組可多選：舊版單一模組 (module) 轉為 modules
  if (typeof state.module === 'string' && state.module && !(state.modules || []).length) state.modules = [state.module];
  delete state.module;
  state.modules = (state.modules || []).filter((n) => DATA.modules.some((m) => m.name === n));
  state.cmp = (state.cmp || []).filter((oc) => DATA.items.some((p) => p.oc === oc)).slice(0, CMP_MAX);
  if (state.toggles?.jpOnly) { state.sel.jp = ['Yes']; }
  if (state.toggles) delete state.toggles.jpOnly;
  delete state.bands; delete state.custom;   // v3.5 起移除頻段尺
  if (!isGnss()) state.sel.atype = [];        // v3.6 起天線類型只用於 GNSS
  // v3.7 起 TELEC 模組只在 Japan Market = Yes 時使用
  if (state.modules.length && !(state.sel.jp || []).length) state.sel.jp = ['Yes'];
  if (!isJpYes()) state.modules = [];
  // v3.9 起 Form 改為下拉選單 (單選)：舊版多選只保留第一個
  if ((state.sel.form || []).length > 1) state.sel.form = state.sel.form.slice(0, 1);
  $('sortSel').value = state.sort;
  renderPageText();
  setFilters(false);
  update();
}

const savedLang = MODE === 'app' ? store.get('lang') : PARAMS.get('lang');
lang = LANGS.includes(savedLang) ? savedLang : DEFAULT_LANG;
const savedTheme = store.get('theme');
// 使用說明一律淺色 (方便列印)
applyTheme(MODE !== 'app' ? 'light' : savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : null);
applyStaticI18n();
setNet();
// iOS 不支援安裝事件：未安裝時直接顯示「安裝 App」按鈕 (開啟說明)
if (platform === 'ios') $('installBtn').dataset.manual = '1';
refreshInstallBtn();
placeQuick();
DESKTOP_MQ.addEventListener?.('change', () => { placeQuick(); setFilters(false); applyStaticI18n(); renderAll(); });
route();
if (MODE === 'embed') runEmbed(PARAMS.get('embed'));
if (MODE === 'guide') renderGuide();

/* Service Worker：僅在 https / localhost 註冊；偵測到新版即提示 */
if (MODE === 'app' && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      requestPersist();
      // 第一次安裝完成 (全部檔案已快取) 時提示可離線使用
      if (!navigator.serviceWorker.controller) {
        navigator.serviceWorker.addEventListener('controllerchange', () => toast(t('offlineReady'), 2500), { once: true });
      }
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw?.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) $('verBtn').classList.add('has-update');
        });
      });
    }).catch(() => { /* 無 sw.js (例如預覽環境) 時忽略 */ });
  });
}
// 啟動後檢查 version.json (失敗時安靜略過)
if (MODE === 'app') {
  setTimeout(checkForUpdate, 1500);
  // App 回到前景時 (例如 iPhone 從背景切回，頁面並未重新載入) 再檢查一次新版本，
  // 同時請瀏覽器檢查 sw.js 是否更新；最多每 10 分鐘一次
  let lastCheck = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !navigator.onLine || Date.now() - lastCheck < 10 * 60 * 1000) return;
    lastCheck = Date.now();
    checkForUpdate();
    navigator.serviceWorker?.getRegistration().then((r) => r?.update()).catch(() => {});
  });
}
