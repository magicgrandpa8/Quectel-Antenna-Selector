<script>
/* 在畫面繪製前套用使用者儲存的深淺色主題，並同步「手機最上方狀態列」的顏色。
   iOS Safari 只在載入時讀取 theme-color，之後刪除/新增標籤不會反映，
   因此必須在這裡就決定正確的顏色 (後續切換時只更新 content，不刪除標籤)。 */
(function () {
  try {
    var t = localStorage.getItem('antsel:theme');
    var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    var c = dark ? '#12191E' : '#F3F0E9';
    var ms = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < ms.length; i++) ms[i].setAttribute('content', c);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  } catch (e) { /* 無法讀取 storage 時維持依系統設定 */ }
})();
</script>

/* ======================================================================
   Design tokens
   ====================================================================== */
:root {
  /* 淺色模式：無印良品風格 (生成り麻布底、和紙白、墨色文字、牛皮紙／木質色強調) */
  --paper: #F3F0E9;           /* 生成り (未漂白棉麻) */
  --surface: #FBFAF7;         /* 和紙白 */
  --ink: #3C3833;             /* 暖墨色 */
  --muted: #73695F;           /* 暖灰 */
  --rule: #DDD6CA;            /* 麻布線條 */
  --band: #EAE5DB;
  --accent: #7A6048;          /* 牛皮紙／木質 */
  --accent-soft: #EEE6DA;
  --accent-ink: #FFFFFF;
  --warn: #8A6116;            /* 黃土 */
  --warn-soft: #F3E7CF;
  --danger: #8E2A2A;          /* 無印良品深紅 */
  --danger-soft: #F2E1DC;
  --font: "IBM Plex Sans", "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans CJK TC", "Noto Sans TC", "Source Han Sans TC", system-ui, sans-serif;
  --r-sm: 4px;
  --r-md: 8px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12191E; --surface: #1A2329; --ink: #E4EAED; --muted: #94A3AC;
    --rule: #2E3B43; --band: #24313A; --accent: #2DB3A7; --accent-soft: #163C3A; --accent-ink: #08201E;
    --warn: #E8B15A; --warn-soft: #3A2C14; --danger: #F07A8E; --danger-soft: #3D1A21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12191E; --surface: #1A2329; --ink: #E4EAED; --muted: #94A3AC;
  --rule: #2E3B43; --band: #24313A; --accent: #2DB3A7; --accent-soft: #163C3A; --accent-ink: #08201E;
  --warn: #E8B15A; --warn-soft: #3A2C14; --danger: #F07A8E; --danger-soft: #3D1A21;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--font); font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ======================================================================
   Header
   ====================================================================== */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.top-inner {
  max-width: 1360px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-right: auto; display: flex; gap: 10px; align-items: center; }
.brand svg { color: var(--accent); flex: none; }
.icon-btn {
  border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-md);
  padding: 6px 10px; cursor: pointer; font-size: 14px;
}
.icon-btn:hover { border-color: var(--muted); }

/* ======================================================================
   Page heading
   ====================================================================== */
.spectrum { max-width: 1360px; margin: 0 auto; padding: 20px 20px 8px; }
.spectrum-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.agent-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface);
  font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
}
.agent-btn:hover { background: var(--accent); color: var(--accent-ink); }
html.offline .agent-btn { opacity: .55; }
.spectrum-head h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
.spectrum-head p { margin: 0; color: var(--muted); font-size: 13px; }

/* ======================================================================
   Layout
   ====================================================================== */
.layout {
  max-width: 1360px; margin: 0 auto; padding: 12px 20px 40px;
  display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 24px; align-items: start;
}
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto; padding-right: 4px; }
.filters-head { display: none; }
.fgroup { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.fgroup:first-child { padding-top: 0; }
.fgroup > .ftitle { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; }
.fgroup details summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.fgroup details summary::-webkit-details-marker { display: none; }
.fgroup details summary::after { content: "+"; color: var(--muted); }
.fgroup details[open] summary::after { content: "−"; }
.fgroup details[open] summary { margin-bottom: 8px; }
.sel-count { color: var(--accent); font-weight: 600; margin-left: 6px; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip small { color: var(--muted); font-size: 11px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip[aria-pressed="true"] small { color: var(--ink); }
.chip:disabled { opacity: .45; cursor: default; }
.checks { display: grid; gap: 2px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }
.checks label small { margin-left: auto; color: var(--muted); }
.checks input { accent-color: var(--accent); }
.checks label.zero { color: var(--muted); }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; cursor: pointer; }
.toggle input { accent-color: var(--accent); }
select.module {
  width: 100%; padding: 9px 10px; border: 1px solid var(--accent); border-radius: var(--r-md);
  background: var(--surface); font-weight: 600;
}
.module-hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.reset { margin-top: 14px; width: 100%; }

/* ======================================================================
   Results
   ====================================================================== */
.results-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.count { font-size: 15px; }
.count b { font-size: 20px; font-weight: 700; }
.results-bar .spacer { flex: 1; }
.results-bar select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); font-size: 13px; }
.mobile-filter-btn { display: none; }
.active-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.active-tags button {
  border: none; background: var(--accent-soft); color: var(--ink); border-radius: var(--r-sm);
  padding: 3px 8px; font-size: 12px; cursor: pointer;
}
.active-tags button::after { content: " ×"; color: var(--muted); }

.list { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; }
.row {
  display: grid; grid-template-columns: 64px minmax(0, 1.25fr) minmax(200px, 1fr) minmax(0, .9fr);
  gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule);
  cursor: pointer; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.thumb {
  width: 64px; height: 64px; border-radius: var(--r-sm); background: #fff; display: grid; place-items: center; overflow: hidden;
  border: 1px solid var(--rule);
}
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.thumb svg { color: #9AA8B0; }
.oc { font-weight: 700; font-size: 15px; letter-spacing: .01em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pname { color: var(--muted); font-size: 13px; margin-top: 2px; line-height: 1.4; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-sm); background: var(--band); color: var(--ink); }
.badge.jp { background: var(--danger-soft); color: var(--danger); }
.badge.cert { background: var(--accent); color: var(--accent-ink); }
.badge.cert.hit { outline: 2px solid var(--ink); outline-offset: 1px; }
.module-info { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: -2px 0 0; }
.module-info b { color: var(--ink); }
.cert-group { display: grid; gap: 6px; }
.cert-group + .cert-group { margin-top: 10px; }
.cert-group h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.mod-list span small { opacity: .75; margin-left: 4px; }
.badge.np { background: var(--band); color: var(--muted); }
.badge.nrnd { background: var(--warn-soft); color: var(--warn); }
.badge.eol { background: var(--danger-soft); color: var(--danger); }
.freq-text { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; font-size: 12px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.specs div { min-width: 0; }
.specs .wide { grid-column: 1 / -1; }
.specs .wide dd { font-weight: 600; white-space: normal; }
.specs .lna dd, .lna-line b { color: var(--accent); font-weight: 700; }
.lna-line { margin: 8px 0 0; font-size: 14px; }
.size-filter { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.size-filter input { width: 90px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); }
.size-filter input.active { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.size-hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

.empty { padding: 48px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
.more { display: block; margin: 12px auto 0; }
.more[hidden] { display: none; }
/* Datasheet 按鈕 (不顯示網址) */
.ds-btn {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--accent); color: var(--accent);
  background: var(--surface); border-radius: var(--r-sm); padding: 2px 8px; font-size: 12px; font-weight: 600; cursor: pointer;
}
.ds-btn:hover { background: var(--accent); color: var(--accent-ink); }
.ds-btn.lg { padding: 6px 12px; font-size: 14px; border-radius: var(--r-md); }
html.offline .ds-btn { opacity: .5; }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ======================================================================
   Detail dialog
   ====================================================================== */
dialog.detail {
  width: min(880px, calc(100vw - 24px)); max-height: calc(100% - 48px); padding: 0;
  border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); color: var(--ink);
}
dialog.detail::backdrop { background: rgba(10, 18, 24, .5); }
.d-head { display: grid; grid-template-columns: 140px 1fr auto; gap: 20px; padding: 20px; border-bottom: 1px solid var(--rule); align-items: start; }
.d-head .thumb { width: 140px; height: 140px; }
.d-head h2 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.d-head p { margin: 4px 0 0; color: var(--muted); }
.d-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.d-body { padding: 16px 20px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.d-body > * { min-width: 0; }
.d-body h3 { font-size: 14px; margin: 0 0 8px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 20px; margin: 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-md); }
/* 表格保持可讀寬度，窄螢幕改為在框內左右捲動，避免文字被逐字拆開 */
.tbl-wrap table { min-width: 560px; }
.tbl-wrap th { white-space: nowrap; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; white-space: pre-line; }
th { color: var(--muted); font-weight: 500; background: var(--paper); }
tr:last-child td { border-bottom: 0; }
.mod-list { display: flex; flex-wrap: wrap; gap: 6px; }
.mod-list span { font-size: 12px; padding: 3px 8px; border-radius: var(--r-sm); background: var(--band); }
.mod-list span.hit { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.link-btn { background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; font-weight: 600; }
.notice { font-size: 13px; padding: 10px 12px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--ink); }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: var(--r-md); font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
}
.toast.show { opacity: 1; }
footer { max-width: 1360px; margin: 0 auto; padding: 0 20px 32px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

/* ======================================================================
   Responsive
   ====================================================================== */
@media (max-width: 1080px) {
  .row { grid-template-columns: 56px minmax(0, 1fr) minmax(160px, 1fr); }
  .row .specs { grid-column: 2 / -1; }
  .thumb { width: 56px; height: 56px; }
}
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .filters {
    position: fixed; inset: 0 0 0 auto; width: min(360px, 92vw); max-height: none; z-index: 40;
    background: var(--paper); padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    transform: translateX(105%); transition: transform .2s ease; border-left: 1px solid var(--rule);
  }
  .filters.open { transform: none; box-shadow: -12px 0 32px rgba(0, 0, 0, .18); }
  .filters-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; }
  .mobile-filter-btn { display: inline-block; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 18, 24, .4); z-index: 39; }
  .row { grid-template-columns: 56px minmax(0, 1fr); gap: 10px 12px; }
  .row .strip-cell, .row .specs { grid-column: 1 / -1; }
  .d-head { grid-template-columns: 96px 1fr; }
  .d-head .thumb { width: 96px; height: 96px; }
  .d-head .close-wrap { grid-column: 1 / -1; grid-row: 1; justify-self: end; }
  .spectrum-head h1 { font-size: 19px; }
}

/* ======================================================================
   v2.0 新增：頂部工具列、快速選單、版本資訊
   ====================================================================== */
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tool-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: var(--r-md); padding: 6px 10px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap;
}
.tool-btn:hover { border-color: var(--muted); }
.tool-btn svg { flex: none; }
.tool-btn.ver { color: var(--muted); }
/* 使用說明視窗 (全螢幕) */
dialog.guide-dlg { width: 100vw; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #E7E2D8; }
dialog.guide-dlg[open] { display: flex; flex-direction: column; }
dialog.guide-dlg::backdrop { background: rgba(10, 18, 24, .5); }
.guide-bar { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
  background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--rule); }
.guide-bar h2 { margin: 0 auto 0 0; font-size: 16px; }
.guide-bar button:disabled { opacity: .5; cursor: progress; }
#guideFrame { flex: 1; width: 100%; border: 0; background: #E7E2D8; }
.tool-btn.lang { padding: 0 0 0 10px; position: relative; }
.tool-btn.lang select {
  appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: inherit;
  font: inherit; font-weight: 500; padding: 6px 24px 6px 0; cursor: pointer;
}
.tool-btn.lang::after { content: "▾"; position: absolute; right: 9px; pointer-events: none; font-size: 11px; color: var(--muted); }
/* 日文 / 韓文：使用對應語系字型，避免漢字字形混用 */
:root:lang(ja) { --font: "IBM Plex Sans", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans CJK JP", "Noto Sans JP", system-ui, sans-serif; }
:root:lang(ko) { --font: "IBM Plex Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", system-ui, sans-serif; }
/* 韓文以詞為單位換行，避免單字被拆開 */
:root:lang(ko) body { word-break: keep-all; overflow-wrap: anywhere; }
.tool-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); display: none; }
.tool-btn.has-update .dot { display: inline-block; }
.tool-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.quick {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px 12px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 12px;
  max-width: 640px;
}
.quick label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; min-width: 0; }
.quick select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r-sm);
  background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 500;
}
.quick select.active { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.quick .module select { border-color: var(--accent); }

.ver-grid { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; margin: 0; font-size: 14px; }
.ver-grid dt { color: var(--muted); }
.ver-grid dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.ok { color: var(--accent); }
dialog.detail.small { width: min(560px, calc(100vw - 24px)); }
.d-simple-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--rule); }
.d-simple-head h2 { margin: 0; font-size: 18px; }

/* 離線狀態標示 */
.net { display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px;
  border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.net::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
html.offline .net { display: inline-flex; }
.tool-btn.install { border-color: var(--accent); color: var(--accent); }
.tool-btn[hidden] { display: none; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 14px; }
.web-link { border: 1px solid var(--rule); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 10px; }
.web-link .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.web-link .primary {
  display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink);
  border: 1px solid var(--accent); border-radius: var(--r-md); padding: 8px 14px; font-weight: 600; cursor: pointer;
}
.web-link .hint { margin: 0; font-size: 12px; color: var(--muted); }
.web-link .addr { margin: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.steps b { color: var(--accent); }
.kbd { display: inline-block; padding: 0 6px; border: 1px solid var(--rule); border-radius: 4px; font-size: 13px; }
/* 以 App 方式執行時：關閉文字選取放大、讓按鈕更像原生 */
@media (display-mode: standalone) {
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  input, textarea, .oc, .kv dd, .freq-text, .pname { -webkit-user-select: text; user-select: text; }
}

@media (max-width: 820px) {
  .top-inner { gap: 10px; padding: 10px 14px; }
  .brand { width: 100%; }
  .tool-btn .lbl { display: none; }
  .tool-btn.ver .lbl, .tool-btn.install .lbl { display: inline; }
  .quick { padding: 10px; }
}

/* ======================================================================
   v3.13 版面整理 (電腦版，寬度 > 820px)：篩選集中左欄、頁首精簡、清單精簡
   手機與平板 (≤ 820px) 維持原版面，只把頁首按鈕依螢幕寬度平均分配
   ====================================================================== */
.menu-wrap { position: relative; }
.more-count:not(:empty) { font-size: 12px; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 4px 0 0; font-size: 13px; }
.keys div { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.keys dt { color: var(--muted); font-size: 12px; white-space: nowrap; }
.keys dd { margin: 0; font-weight: 600; }
.keys .lna dd { color: var(--accent); }
.ds-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--accent); cursor: pointer; }
.ds-icon:hover { border-color: var(--accent); }

@media (min-width: 821px) {
  /* 頁首：語言、使用說明、「⋯」 */
  .top-inner { flex-wrap: nowrap; }
  .brand { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { flex-wrap: nowrap; }
  .menu-btn { padding: 6px 10px; }
  .menu-btn .dot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); position: absolute; top: 4px; right: 4px; }
  .menu-wrap:has(.has-update) .menu-btn .dot { display: block; }
  .tool-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 200px; padding: 6px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 12px 32px rgba(40, 32, 20, .14);
    display: grid; gap: 2px; }
  .tool-menu[hidden] { display: none; }
  .tool-menu .tool-btn { width: 100%; justify-content: flex-start; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .tool-menu .tool-btn:hover { background: var(--band); }
  .tool-menu .tool-btn .lbl { display: inline !important; }
  .tool-menu .tool-btn.ver { color: var(--ink); }

  /* 篩選集中在左欄：搜尋 → 下拉選單 → 更多條件 → 清除 */
  .layout { grid-template-columns: 296px minmax(0, 1fr); gap: 32px; padding-top: 8px; }
  .filters { display: grid; gap: 16px; align-content: start; padding: 0 4px 16px 0; }
  .filters .search { margin: 0; }
  .filters .quick { background: none; border: 0; padding: 0; margin: 0; max-width: none; gap: 16px; }
  .filters .quick label { font-size: 13px; color: var(--ink); font-weight: 600; gap: 6px; }
  .filters .quick label .en { font-weight: 400; color: var(--muted); font-size: 12px; }
  .filters .quick select { padding: 10px 12px; font-size: 14px; border-radius: 8px; }
  .more-filters { border-top: 1px solid var(--rule); padding-top: 16px; }
  .more-filters > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .more-filters > summary::-webkit-details-marker { display: none; }
  .more-filters > summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 400; font-size: 18px; }
  .more-filters[open] > summary::after { content: "−"; }
  .more-filters #filterBody { margin-top: 8px; }
  .reset { margin-top: 0; }
  .results-bar { margin-bottom: 16px; }
  .count b { font-size: 22px; }
  .active-tags { display: none; }   /* 條件已顯示在左欄，不重複 */

  /* 清單每列：一行關鍵值 */
  .row.r2 { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; padding: 16px; align-items: start; }
  .r-main { display: grid; gap: 4px; min-width: 0; }
  .r-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .r-top .oc { font-size: 15px; font-weight: 700; }
  .row.r2 .pname { margin: 0; font-size: 13px; color: var(--muted); }
}

@media (max-width: 820px) {
  /* 手機：「更多條件」不收合 (維持原本的篩選抽屜內容) */
  /* 頁首按鈕：中文 / 深色 / 強制更新 / 使用說明 / 版本，依螢幕寬度平均分配 */
  .tools { width: 100%; flex-wrap: wrap; gap: 6px; }
  .menu-btn { display: none; }
  .menu-wrap, .tool-menu, .tool-menu[hidden] { display: contents; }
  .tools > .tool-btn, .tools > label.tool-btn, .tool-menu > .tool-btn:not([hidden]) {
    flex: 1 1 0; min-width: 0; justify-content: center; height: 38px; padding: 0 6px; box-sizing: border-box;
  }
  .tool-btn.lang { order: 1; padding: 0 4px; }
  #themeBtn { order: 2; } #guideBtn { order: 3; } #verBtn { order: 4; }
  /* 「安裝 App」(僅 iPhone Safari 等尚未安裝時出現)：獨立一整列，不擠壓上面 5 個按鈕 */
  .tool-menu > #installBtn:not([hidden]) { order: 6; flex: 1 1 100%; }
  .tool-btn.lang > svg { display: none; }                       /* 語言：省略地球圖示 */
  .tool-btn.lang select { padding: 6px 14px 6px 2px; text-align: center; }
  .tool-btn.lang::after { right: 5px; }
  #verBtn .lbl { font-size: 12px; }
  .net { order: 0; flex: none; }
  .tool-btn.lang select { min-width: 0; max-width: 100%; text-overflow: ellipsis; }
  .tool-btn .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #verBtn [data-i18n="verAria"] { display: none; }   /* 手機只顯示版本號 */
  .filters > .search { margin: 4px 0 12px; }
}


/* 產品照片：可點擊放大 */
.thumb.zoomable { padding: 0; cursor: zoom-in; position: relative; font: inherit; color: inherit; }
.thumb.zoomable:hover { border-color: var(--accent); }
.zoom-hint { display: none; position: absolute; right: 4px; bottom: 4px; width: 22px; height: 22px; border-radius: 50%;
  place-items: center; background: rgba(255, 255, 255, .92); color: var(--accent); box-shadow: 0 1px 4px rgba(40, 32, 20, .25); }
.d-head .zoom-hint, .thumb.zoomable:hover .zoom-hint, .thumb.zoomable:focus-visible .zoom-hint { display: grid; }
dialog.photo-dlg { width: min(760px, calc(100vw - 24px)); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--rule);
  border-radius: 14px; background: var(--surface); color: var(--ink); overflow: auto; }
dialog.photo-dlg::backdrop { background: rgba(20, 16, 10, .62); }
.photo-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 18px; }
.photo-bar strong { font-size: 17px; }
.photo-stage { background: #FFFFFF; display: grid; place-items: center; padding: 20px; min-height: 220px; }
.photo-stage img { display: block; max-width: 100%; max-height: calc(100vh - 190px); height: auto; object-fit: contain; }
.photo-name { margin: 0; padding: 12px 18px 16px; font-size: 13px; color: var(--muted); }

/* ======================================================================
   Liquid Glass (仿 iOS 液態玻璃)：半透明毛玻璃、邊緣高光、浮起陰影、膠囊按鈕
   - 背景加上柔和的暖色光暈，讓玻璃有可折射的內容
   - 「減少透明度」或不支援 backdrop-filter 時，退回原本的實色樣式
   ====================================================================== */
:root {
  --glass: rgba(252, 250, 246, .56);
  --glass-strong: rgba(252, 250, 246, .76);
  --glass-btn: rgba(255, 255, 255, .46);
  --glass-btn-hover: rgba(255, 255, 255, .72);
  --glass-edge: rgba(255, 255, 255, .78);
  --glass-line: rgba(122, 96, 72, .14);
  --glass-shadow: 0 12px 32px rgba(70, 52, 30, .10), 0 2px 6px rgba(70, 52, 30, .06);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .9), inset 0 -1px 0 rgba(122, 96, 72, .06);
  --glass-sheen: linear-gradient(140deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, .06) 36%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, .14));
  --glass-blur: blur(22px) saturate(170%);
  --glow-1: rgba(122, 96, 72, .17); --glow-2: rgba(142, 42, 42, .07); --glow-3: rgba(176, 150, 110, .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glass: rgba(30, 38, 44, .54); --glass-strong: rgba(30, 38, 44, .74);
    --glass-btn: rgba(255, 255, 255, .07); --glass-btn-hover: rgba(255, 255, 255, .14);
    --glass-edge: rgba(255, 255, 255, .14); --glass-line: rgba(255, 255, 255, .09);
    --glass-shadow: 0 12px 32px rgba(0, 0, 0, .38), 0 2px 6px rgba(0, 0, 0, .25);
    --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .3);
    --glass-sheen: linear-gradient(140deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .02) 40%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, .05));
    --glow-1: rgba(45, 179, 167, .12); --glow-2: rgba(240, 122, 142, .06); --glow-3: rgba(90, 130, 160, .12);
  }
}
:root[data-theme="dark"] {
  --glass: rgba(30, 38, 44, .54); --glass-strong: rgba(30, 38, 44, .74);
  --glass-btn: rgba(255, 255, 255, .07); --glass-btn-hover: rgba(255, 255, 255, .14);
  --glass-edge: rgba(255, 255, 255, .14); --glass-line: rgba(255, 255, 255, .09);
  --glass-shadow: 0 12px 32px rgba(0, 0, 0, .38), 0 2px 6px rgba(0, 0, 0, .25);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .3);
  --glass-sheen: linear-gradient(140deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .02) 40%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, .05));
  --glow-1: rgba(45, 179, 167, .12); --glow-2: rgba(240, 122, 142, .06); --glow-3: rgba(90, 130, 160, .12);
}

/* 背景光暈 */
body {
  background:
    radial-gradient(1100px 620px at 6% -8%, var(--glow-1), transparent 62%),
    radial-gradient(900px 520px at 100% 4%, var(--glow-2), transparent 58%),
    radial-gradient(1000px 720px at 50% 112%, var(--glow-3), transparent 62%),
    var(--paper);
  background-attachment: fixed;
}

/* 大面積玻璃：頁首、篩選、清單、視窗、選單 */
.top, .quick, .list, dialog.detail, dialog.photo-dlg, .tool-menu, .guide-bar {
  background-color: var(--glass);
  background-image: var(--glass-sheen);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--glass-shadow), var(--glass-hi);
}
.top { border-width: 0 0 1px; border-bottom-color: var(--glass-line); box-shadow: 0 1px 0 var(--glass-edge) inset, 0 6px 20px rgba(70, 52, 30, .06); }
.quick, .list { border-radius: 20px; }
.list .row { border-bottom-color: var(--glass-line); background: transparent; }
.list .row:hover { background: rgba(255, 255, 255, .28); }
dialog.detail, dialog.photo-dlg { border-radius: 24px; background-color: var(--glass-strong); }
dialog.detail::backdrop, dialog.photo-dlg::backdrop {
  background: rgba(40, 30, 18, .22); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.d-head, .photo-bar { border-bottom-color: var(--glass-line); }
.photo-stage { border-radius: 0; }
.tool-menu { border-radius: 18px; background-color: var(--glass-strong); }
.thumb { border-radius: 12px; border-color: var(--glass-edge); box-shadow: 0 2px 8px rgba(70, 52, 30, .08); }

@media (min-width: 821px) {
  /* 電腦版左欄篩選：一整塊玻璃面板 */
  .filters { background-color: var(--glass); background-image: var(--glass-sheen);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow), var(--glass-hi);
    border-radius: 22px; padding: 18px; top: calc(env(safe-area-inset-top, 0px) + 76px); }
  .filters .quick { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0; }   /* 左欄內不再疊一層玻璃 */
  .tool-menu .tool-btn { background: transparent; border: 0; box-shadow: none; }
  .tool-menu .tool-btn:hover { background: var(--glass-btn-hover); }
}
@media (max-width: 820px) {
  .filters.open { background-color: var(--glass-strong); background-image: var(--glass-sheen);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border-left: 1px solid var(--glass-edge); }
  .tool-menu, .tool-menu[hidden] { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* 膠囊玻璃按鈕與輸入框 */
.tool-btn, .icon-btn, .chip, .ds-icon, .ds-btn, .agent-btn, .search, .quick select, .results-bar select, .size-filter input {
  background-color: var(--glass-btn);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--glass-hi), 0 1px 3px rgba(70, 52, 30, .07);
  transition: background-color .15s ease, transform .12s ease, box-shadow .15s ease;
}
.tool-btn, .icon-btn, .chip, .agent-btn, .ds-btn { border-radius: 999px; }
.ds-icon { border-radius: 14px; }
.search, .quick select, .results-bar select { border-radius: 14px; }
.tool-btn:hover, .icon-btn:hover, .chip:hover, .ds-icon:hover, .ds-btn:hover { background-color: var(--glass-btn-hover); }
.tool-btn:active, .icon-btn:active, .chip:active, .ds-icon:active, .ds-btn:active, .agent-btn:active, .row:active .thumb { transform: scale(.97); }
.agent-btn { color: var(--accent); border-color: var(--glass-edge); }
.agent-btn:hover { background-color: var(--accent); color: var(--accent-ink); }
.quick select.active, .chip[aria-pressed="true"] { background-color: color-mix(in srgb, var(--accent-soft) 78%, transparent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.toast { background: rgba(40, 32, 22, .72); -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; }

/* 退回實色：使用者開啟「減少透明度」或瀏覽器不支援模糊時 */
@media (prefers-reduced-transparency: reduce) {
  :root { --glass: var(--surface); --glass-strong: var(--surface); --glass-btn: var(--surface); --glass-btn-hover: var(--band); --glass-sheen: none; }
  .top, .quick, .list, dialog.detail, dialog.photo-dlg, .tool-menu, .guide-bar, .filters, .tool-btn, .icon-btn, .chip, .ds-icon, .ds-btn,
  .agent-btn, .search, .quick select, .results-bar select, .toast { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  body { background: var(--paper); }
}
/* 列印 (含使用說明 PDF 中的手機畫面)：模糊效果無法列印，玻璃改為實色以免內容透出重疊 */
@media print {
  :root { --glass: var(--surface); --glass-strong: var(--surface); --glass-btn: var(--surface); --glass-sheen: none; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: var(--surface); --glass-strong: var(--surface); --glass-btn: var(--surface); }
}

/* ======================================================================
   v3.18：多模組標籤、天線比較、手機底部篩選面板
   ====================================================================== */
.mod-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mod-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  color: var(--ink); background: color-mix(in srgb, var(--accent-soft) 80%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.mod-chip button { width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .08); color: var(--ink); cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
.quick label.module { gap: 6px; }

.cmp-btn { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 5px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
  color: var(--muted); background: var(--glass-btn); border: 1px solid var(--glass-edge); box-shadow: var(--glass-hi); }
.cmp-btn .cb { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--rule); display: grid; place-items: center; font-size: 11px; background: var(--surface); }
.cmp-btn[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.cmp-btn[aria-pressed="true"] .cb { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.r-top .cmp-btn { margin-left: auto; }
.cmp-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 36;
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 999px; font-size: 14px; white-space: nowrap;
  background-color: var(--glass-strong); background-image: var(--glass-sheen); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow), var(--glass-hi); }
.cmp-bar[hidden] { display: none; }
.cmp-go { border: 0; border-radius: 999px; padding: 9px 20px; font-weight: 700; font-size: 14px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.cmp-go:disabled { opacity: .45; cursor: not-allowed; }
dialog.cmp-dlg { width: min(1040px, calc(100vw - 24px)); }
.cmp-top { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--glass-line); flex-wrap: wrap; }
.cmp-top h2 { margin: 0 auto 0 0; font-size: 18px; }
.cmp-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--glass-btn); border: 1px solid var(--glass-edge); }
.cmp-seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
.cmp-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cmp-scroll { overflow-x: auto; padding: 4px 18px 0; }
.cmp-tbl { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13px; }
.cmp-tbl th, .cmp-tbl td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--glass-line); }
.cmp-tbl tbody th { color: var(--muted); font-weight: 500; width: 130px; position: sticky; left: 0; background: var(--glass-strong); }
.cmp-tbl td.diff { background: color-mix(in srgb, var(--accent-soft) 80%, transparent); font-weight: 700; }
.cmp-tbl td.cmp-same { text-align: center; color: var(--muted); padding: 18px; }
.cmp-head { display: grid; gap: 6px; justify-items: start; }
.cmp-head .thumb { width: 96px; height: 96px; }
.cmp-head b { font-size: 15px; }
.cmp-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cmp-acts .ds-btn, .cmp-acts .icon-btn { white-space: nowrap; overflow-wrap: normal; }
.cmp-acts .icon-btn { padding: 3px 10px; }
.cmp-common { padding: 14px 18px 18px; }
.cmp-common h3 { margin: 0 0 8px; font-size: 14px; }

@media (max-width: 820px) {
  /* 底部篩選面板 (取代側邊抽屜)；畫面打開先看到天線清單 */
  .filters {
    position: fixed; inset: auto 0 0 0; width: auto; max-height: 86vh; overflow-y: auto; z-index: 40;
    border-radius: 22px 22px 0 0; border: 1px solid var(--glass-edge); border-bottom: 0;
    background-color: var(--glass-strong); background-image: var(--glass-sheen);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform: translateY(105%); transition: transform .25s ease; box-shadow: none;
  }
  .filters.open { transform: none; box-shadow: 0 -12px 36px rgba(40, 32, 20, .2); border-left: 1px solid var(--glass-edge); }
  .filters::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--rule); margin: 0 auto 8px; }
  .filters .quick { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; padding: 0; margin: 12px 0; gap: 12px; border-radius: 0; }
  .filters > .search { margin: 4px 0 0; }
  .more-filters { border-top: 1px solid var(--glass-line); padding-top: 12px; margin-bottom: 12px; }
  .more-filters > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .more-filters > summary::-webkit-details-marker { display: none; }
  .more-filters > summary::after { content: "+"; margin-left: auto; color: var(--muted); font-size: 18px; }
  .more-filters[open] > summary::after { content: "−"; }
  /* 浮動「篩選」按鈕 */
  #openFilters { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 35;
    display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(40, 32, 20, .28); }
  #openFilters:active { transform: translateX(-50%) scale(.97); }
  #filterBadge:not(:empty) { min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF;
    color: var(--accent); font-size: 13px; display: inline-grid; place-items: center; }
  body.has-cmp #openFilters { bottom: calc(env(safe-area-inset-bottom, 0px) + 82px); }
  .cmp-bar { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
  .layout { padding-bottom: 150px; }
  .cmp-head .thumb { width: 72px; height: 72px; }
  .cmp-tbl tbody th { width: 84px; }
  .cmp-scroll { padding: 4px 12px 0; }
  .cmp-tbl { font-size: 12.5px; table-layout: fixed; }
  .cmp-tbl.cmp-n2 { min-width: 0; }          /* 2 款：剛好放進螢幕寬度 */
  .cmp-tbl.cmp-n3 { min-width: 470px; }      /* 3 款：左右捲動，左側欄位名稱固定 */
  .cmp-tbl th, .cmp-tbl td { padding: 7px 8px; overflow-wrap: anywhere; }
}

/* 頁面最底層也使用主題背景色：狀態列下方與彈性捲動時露出的區域不會是淺色 */
html { background-color: var(--paper); }
/* 手機「篩選」按鈕：沒有套用條件時隱藏空的數字標籤，文字保持置中 */
#filterBadge:empty { display: none; }
#openFilters { justify-content: center; }

/* 有新版本時版本按鈕右上角的紅點 */
#verBtn { position: relative; }
#verBtn.has-update .dot { display: block; position: absolute; top: 4px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
</style>
</head>

<header class="top">
  <div class="top-inner">

<script>

function connFamily(s) {
  if (!s) return NONE;

  if (x.includes('fakra')) return 'FAKRA';
  if (x.includes('rp') && x.includes('sma')) return 'RP-SMA';
  if (x.includes('sma')) return 'SMA';
  if (x.includes('mhf4')) return 'IPEX MHF4';
  if (x.includes('mhf1') || x.includes('u.fl')) return 'IPEX MHF1 / U.FL';
  if (x.includes('mhf') || x.includes('ipex')) return 'IPEX';
  if (x.includes('n type') || x.includes('n-type')) return 'N type';

  return s;

  const m = String(s ?? '').match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
const spanOf = (p) => (p.ranges || []).reduce((a, [lo, hi]) => a + (hi - lo), 0);

/* ==========================================================================
   各頁面設定
   facet.ui: 'select' = 快速下拉選單 (單選)；'chips' / 'checks' = 側欄 (多選)
   ========================================================================== */
const PAGES = {
  main: {
    title: 'mTitle', sub: 'mSub',
    items: () => DATA.items,
    module: true,
    facets: [
      // 下拉選單順序 (由上到下)：
      //   Tech → Japan Market → [TELEC 認證模組：Japan Market = Yes 時] → [GNSS 天線類型：Tech = GNSS 時] → Product Type → Form
      { key: 'type', ui: 'select', get: (p) => typeLabel(p.type) },
      // Japan Market：取自 Excel「Compatible with Japan Market」欄 (YES → Yes，其餘 → No)
      { key: 'jp', ui: 'select', get: (p) => (p.jp ? 'Yes' : 'No'), sort: (a, b) => (b === 'Yes') - (a === 'Yes') },
      // 天線類型只在 Tech 選 GNSS 時出現 (Passive / Active / Dipole)
      { key: 'atype', ui: 'select', title: 'f_gnss', when: () => isGnss(), get: (p) => p.atype || NA,
        scope: (p) => p.type === 'GNSS',                       // 選項只取 GNSS 天線的值
        sort: (a, b) => ((GNSS_ORDER.indexOf(a) + 1) || 99) - ((GNSS_ORDER.indexOf(b) + 1) || 99) },
      { key: 'ptype', ui: 'select', get: (p) => p.ptype || OTHER },
      { key: 'form', ui: 'select', get: (p) => p.form || NA },
      { key: 'mount', ui: 'checks', get: (p) => p.mount || NA },
      { key: 'conn', ui: 'checks', get: (p) => (p.conn && p.conn.length ? p.conn.map(connFamily) : [NONE]) },
      { key: 'ip', ui: 'checks', get: (p) => p.ip || NONE },
      { key: 'qty', ui: 'chips', get: (p) => String(p.qty || '1'), sort: (a, b) => a - b },
      { key: 'brochure', ui: 'chips', get: (p) => p.brochure || NA },
    ],
    toggles: [
      { key: 'certOnly', test: (p) => (p.certs || []).length > 0 },
    ],
  },
};
/** 「技術類別 Tech」這類雙語標題：英文部分以淡色小字顯示 */
function labelHtml(title) {
  const m = String(title).match(/^(.*[^\x00-\x7F])\s+([A-Za-z][A-Za-z ]*)$/);
  return m ? `<span>${esc(m[1])} <span class="en">${esc(m[2])}</span></span>` : `<span>${esc(title)}</span>`;
}
const facetTitle = (f) => t(f.title || 'f_' + f.key);
/** 技術類別是否選了 GNSS (決定是否顯示 GNSS 天線類型選單) */
/** GNSS 天線類型選項順序；其他值 (若 Excel 日後新增) 排在最後 */
const GNSS_ORDER = ['Passive', 'Active', 'Dipole'];
/** Japan Market 是否選 Yes (決定是否顯示 TELEC 認證模組選單) */
const isJpYes = () => (state.sel.jp || []).includes('Yes');
/** 目前生效的 TELEC 認證模組 (僅 Japan Market = Yes 時)；可多選，天線需全部通過認證 */
const selMods = () => (isJpYes() ? state.modules || [] : []);
const certAll = (p, mods) => mods.every((m) => (p.certs || []).includes(m));
const isGnss = () => (state.sel.type || []).includes('GNSS');
const toggleLabel = { certOnly: 'certOnly' };

/* ==========================================================================
   狀態 (每頁獨立，存在 localStorage)
   ========================================================================== */
const store = {
  get(k) { try { return localStorage.getItem('antsel:' + k); } catch { return null; } },
  set(k, v) { if (MODE !== 'app') return; try { localStorage.setItem('antsel:' + k, v); } catch { /* storage 無法使用時忽略 */ } },
  load(page) { try { return JSON.parse(this.get(page) || 'null'); } catch { return null; } },
  save(page, st) { this.set(page, JSON.stringify(st)); },
};
function freshState(pg) {
  const st = { q: '', sel: {}, toggles: {}, sort: 'oc', modules: [], cmp: [], maxL: null };
  PAGES[pg].toggles.forEach((x) => { st.toggles[x.key] = !!x.default; });
  return st;
}

let page = 'main';
let state = freshState('main');
let shown = PAGE_SIZE;
const $ = (id) => document.getElementById(id);

/* ==========================================================================
   篩選引擎
   ========================================================================== */
const asArr = (v) => (Array.isArray(v) ? v : [v]);

/** 依目前條件篩選；skipKey 用於計算某面向的選項計數 (忽略自身) */
function filterItems(skipKey) {
  const cfg = PAGES[page];
  const q = state.q.trim().toLowerCase();
  return cfg.items().filter((p) => {
    // 計算 Japan Market 的選項數量時不套用模組條件：改選 No 會清除模組，結果應以清除後為準
    if (cfg.module && skipKey !== '__module' && skipKey !== 'jp' && selMods().length && !certAll(p, selMods())) return false;
    for (const x of cfg.toggles) if (state.toggles[x.key] && !x.test(p)) return false;
    for (const f of cfg.facets) {
      if (f.key === skipKey || (f.when && !f.when())) continue;
      const sel = state.sel[f.key];
      if (sel && sel.length && !asArr(f.get(p)).some((v) => sel.includes(v))) return false;
    }
    if (state.maxL && !(p.dimL != null && p.dimL <= state.maxL)) return false;
    if (q) {
      const hay = [p.oc, p.name, p.desc, p.freq, p.form, p.atype, p.dim, p.replace, (p.certs || []).join(' ')]
        .join(' ').toLowerCase();
      if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  });
}
function sorted(list) {
  const arr = list.slice();
  if (state.sort === 'gain') {
    const g = (p) => firstNum(p.techs?.[0]?.gain) ?? -99;
    arr.sort((a, b) => g(b) - g(a));
  } else if (state.sort === 'span') {
    arr.sort((a, b) => spanOf(b) - spanOf(a));
  } else if (state.sort === 'size') {
    arr.sort((a, b) => (a.dimL ?? Infinity) - (b.dimL ?? Infinity));
  } else {
    arr.sort((a, b) => a.oc.localeCompare(b.oc));
  }
  // 選定模組時，已認證的天線本來就全部符合；未選模組時有 TELEC 認證者排前面 (穩定排序)
  if (!selMods().length) arr.sort((a, b) => ((b.certs || []).length > 0) - ((a.certs || []).length > 0));
  return arr;
}
function counts(facet) {
  const m = new Map();
  for (const p of filterItems(facet.key)) for (const v of new Set(asArr(facet.get(p)))) m.set(v, (m.get(v) || 0) + 1);
  return m;
}
function allValues(facet) {
  const set = new Set();
  for (const p of PAGES[page].items()) if (!facet.scope || facet.scope(p)) asArr(facet.get(p)).forEach((v) => set.add(v));
  const arr = [...set];
  if (facet.sort) return arr.sort(facet.sort);
  // 特殊代號 (未標示/無/其他) 排最後
  return arr.sort((a, b) => (a.startsWith('__') - b.startsWith('__')) || String(a).localeCompare(String(b)));
}

/* ==========================================================================
   Render：快速下拉選單 (模組 / Type / Product Type / Antenna Type)
   ========================================================================== */
function renderQuick() {
  const cfg = PAGES[page];
  let html = '';
  for (const f of cfg.facets.filter((x) => x.ui === 'select' && (!x.when || x.when()))) {
    const c = counts(f);
    const cur = (state.sel[f.key] || [])[0] || '';
    const total = filterItems(f.key).length;
    const opts = allValues(f).map((v) => {
      const n = c.get(v) || 0;
      if (!n && v !== cur && isDesktop()) return '';
      return `<option value="${esc(v)}"${v === cur ? ' selected' : ''}${!n && v !== cur ? ' disabled' : ''}>${esc(valLabel(v))} (${n})</option>`;
    }).join('');
    html += `<label>${labelHtml(facetTitle(f))}
      <select data-quick="${f.key}" class="${cur ? 'active' : ''}"><option value="">${esc(t('all'))} (${total})</option>${opts}</select></label>`;
    // TELEC 認證模組：緊接在 Japan Market 之後，且只在 Japan Market = Yes 時出現
    if (f.key === 'jp' && cfg.module && isJpYes()) html += moduleSelectHtml();
  }
  $('quick').innerHTML = html;
}

/** TELEC 認證模組選單 (可多選)：已選模組以標籤顯示，「新增模組」選單的數字為加入後仍符合的天線數 */
function moduleSelectHtml() {
  const mods = state.modules || [];
  const base = filterItems('__module').filter((p) => certAll(p, mods));
  const groups = new Map();
  for (const m of DATA.modules) {
    if (mods.includes(m.name)) continue;
    const n = base.filter((p) => (p.certs || []).includes(m.name)).length;
    if (!n && isDesktop()) continue;                      // 電腦版隱藏 0 筆的選項
    if (!groups.has(m.cat)) groups.set(m.cat, []);
    groups.get(m.cat).push(`<option value="${esc(m.name)}"${n ? '' : ' disabled'}>${esc(m.name)} (${n})</option>`);
  }
  const opts = [...groups].map(([cat, list]) => `<optgroup label="${esc(cat)}">${list.join('')}</optgroup>`).join('');
  const chips = mods.map((m) => `<span class="mod-chip">${esc(m)}<button type="button" data-rm-mod="${esc(m)}" aria-label="${esc(t('removeTag', { x: m }))}">×</button></span>`).join('');
  let html = `<label class="module" title="${esc(t('moduleHint'))}"><span>${esc(t('module'))} <span class="en">${esc(t('modMulti'))}</span></span>
      ${chips ? `<span class="mod-chips">${chips}</span>` : ''}
      <select data-quick="__module" class="${mods.length ? 'active' : ''}"><option value="">${esc(mods.length ? t('modAdd') : t('allModules'))}</option>${opts}</select></label>`;
  if (mods.length === 1) {
    const m = DATA.modules.find((x) => x.name === mods[0]);
    if (m) html += `<p class="module-info">${t('modInfo', { c: esc(m.cat), d: esc(m.date || t('noDate')), n: m.n })}</p>`;
  } else if (mods.length > 1) {
    html += `<p class="module-info">${t('modBoth', { k: mods.length, n: base.length })}</p>`;
  }
  return html;
}

/* ==========================================================================
   Render：側欄篩選
   ========================================================================== */
function renderFilters() {
  const cfg = PAGES[page];
  if (document.activeElement !== $('q')) $('q').value = state.q;
  let html = `<div class="fgroup"><p class="ftitle"><label for="maxL">${esc(t('f_size'))}</label></p>
    <div class="size-filter"><span>${esc(t('sizeLbl'))}</span>
      <input id="maxL" type="number" inputmode="decimal" min="0" step="any" value="${state.maxL ?? ''}" class="${state.maxL ? 'active' : ''}" placeholder="—">
      <span>${esc(t('sizeUnit'))}</span></div>
    <p class="size-hint">${esc(t('sizeHint'))}</p></div>`;
  for (const f of cfg.facets.filter((x) => x.ui !== 'select')) {
    const c = counts(f);
    const sel = state.sel[f.key] || [];
    const vals = allValues(f);
    if (f.ui === 'chips') {
      html += `<div class="fgroup"><p class="ftitle">${esc(facetTitle(f))}</p><div class="chips">` +
        vals.map((v) => {
          const n = c.get(v) || 0, on = sel.includes(v);
          if (!n && !on && isDesktop()) return '';
          return `<button type="button" class="chip" data-facet="${f.key}" data-val="${esc(v)}" aria-pressed="${on}"${!n && !on ? ' disabled' : ''}>${esc(valLabel(v))} <small>${n}</small></button>`;
        }).join('') + `</div></div>`;
    } else {
      html += `<div class="fgroup"><details${sel.length ? ' open' : ''}><summary>${esc(facetTitle(f))}${sel.length ? `<span class="sel-count">${sel.length}</span>` : ''}</summary><div class="checks">` +
        vals.map((v) => {
          const n = c.get(v) || 0, on = sel.includes(v);
          if (!n && !on && isDesktop()) return '';
          return `<label class="${n ? '' : 'zero'}"><input type="checkbox" data-facet="${f.key}" data-val="${esc(v)}"${on ? ' checked' : ''}> ${esc(valLabel(v))} <small>${n}</small></label>`;
        }).join('') + `</div></details></div>`;
    }
  }
  html += `<div class="fgroup">` + cfg.toggles.map((x) =>
    `<label class="toggle"><input type="checkbox" data-toggle="${x.key}"${state.toggles[x.key] ? ' checked' : ''}> ${esc(t(toggleLabel[x.key]))}</label>`).join('') + `</div>`;

  const fid = document.activeElement?.id;
  $('filterBody').innerHTML = html;
  if (fid === 'maxL') $('maxL').focus();
  // 「更多條件」已套用的數量
  const n = cfg.facets.filter((f) => f.ui !== 'select').reduce((a, f) => a + (state.sel[f.key] || []).length, 0)
    + (state.maxL ? 1 : 0) + cfg.toggles.filter((x) => state.toggles[x.key]).length;
  $('moreCount').textContent = n ? String(n) : '';
  if (n && !$('moreFilters').open && !renderFilters.opened) { $('moreFilters').open = true; renderFilters.opened = true; }
}

/* ==========================================================================
   LNA 增益 (主動式 GNSS) 與 IPEX 連接器＋線材
   ========================================================================== */
/** LNA 增益：Excel 值多為「28 ±3」，未含單位時補上 dB。有值即代表主動式 GNSS 天線 */
const fmtLna = (v) => (v ? (/db/i.test(v) ? v : `${v} dB`) : '');
/**
 * 連接器與線材合併描述 (每一條線一段)，適用：
 *   - IPEX MHF 連接器：含線徑，例「IPEX MHF1 接頭＋RF1.13 線材（Φ1.13 mm），線長 100 mm」
 *   - RG174 / RG174LL 線材：例「SMA Male 接頭＋RG174 線材，線長 300 mm」
 * 第 n 條線對應 Connector Type n；連接器欄位較少時沿用最後一個 (Excel 多只填 Type1)。
 * 線徑只在型號含尺寸時顯示 (RF1.13 → Φ1.13 mm)；線長單位為 mm。
 * 不符合上述條件時回傳 null，維持連接器與線材分開顯示。
 */
const RG174_RE = /rg\s*174/i;
const IPEX_RE = /mhf|ipex|u\.fl/i;
function connCableInfo(p) {
  const conns = p.conn || [];
  const cables = p.cables || [];
  if (!cables.length || !(conns.some((c) => IPEX_RE.test(c)) || cables.some((c) => RG174_RE.test(c.type || '')))) return null;
  const leads = cables.map((cab, i) => {
    const c = conns[Math.min(i, conns.length - 1)] || '';
    const d = (String(cab.type || '').match(/^RF\s*(\d+(?:\.\d+)?)/i) || [])[1];
    if (c && cab.type && cab.len) return t(d ? 'cxFull' : 'cxLen', { c, t: cab.type, d, l: cab.len });
    return [c, cab.type, cab.len && `${cab.len} mm`].filter(Boolean).join(' / ');
  });
  // 相同的線合併為「×N」
  const counts = new Map();
  for (const x of leads) counts.set(x, (counts.get(x) || 0) + 1);
  return [...counts].map(([x, n]) => (n > 1 ? `${x} ×${n}` : x)).join(t('cxSep'));
}

/* ==========================================================================
   產品照片放大檢視：先顯示縮圖，原始解析度照片 (photos/) 載入後替換；最多放大到原圖 2 倍
   ========================================================================== */
/** 原始解析度照片包 (photos.json)：第一次放大檢視時載入一次，之後重複使用 */
let photoBundle = null;
function loadPhotos() {
  if (!photoBundle) {
    photoBundle = fetch('photos.json').then((r) => (r.ok ? r.json() : {})).catch(() => {
      photoBundle = null;   // 失敗 (例如離線且尚未快取) 時下次再試
      return {};
    });

  return photoBundle;
}
async function openPhoto(oc) {
  const p = PAGES[page].items().find((x) => x.oc === oc);
  if (!p) return;
  const img = $('photoImg');
  $('photoTitle').textContent = p.oc;

  $('photoClose').textContent = t('close');

/** 電腦版 (寬度 > 820px) 使用新版面；手機與平板維持原版面 */
const DESKTOP_MQ = matchMedia('(min-width: 821px)');
const isDesktop = () => DESKTOP_MQ.matches;
/** 下拉選單位置：電腦版在左欄 (搜尋下方)，手機版在清單上方 (原位置) */
function placeQuick() {

/* ---------- 天線比較 (最多 CMP_MAX 款) ---------- */
const CMP_MAX = 3;
function cmpBtn(p) {

  return `<button type="button" class="cmp-btn" data-cmp="${esc(p.oc)}" aria-pressed="${on}" aria-label="${esc(t('cmpAria', { oc: p.oc }))}"><span class="cb" aria-hidden="true">${on ? '✓' : ''}</span>${esc(t('cmpAdd'))}</button>`;

function toggleCmp(oc) {

function renderCmpBar() {

  document.body.classList.toggle('has-cmp', n > 0);
  $('cmpCount').innerHTML = t('cmpBar', { n: `<b>${n}</b>` });

  $('cmpGo').textContent = t('cmpGo');

let cmpDiffOnly = false;
function openCompare() {
  const ps = (state.cmp || []).map((oc) => DATA.items.find((p) => p.oc === oc)).filter(Boolean);
  if (ps.length < 2) { toast(t('cmpNeed2')); return; }
  const tech = (p) => p.techs?.[0] || {};
  const cx = (p) => connCableInfo(p) || (p.conn || []).join(', ');

/** 清單的關鍵值：增益、尺寸、連接器 (含線材) 或安裝方式、IP 等級、LNA 增益 */
function keyLine(p) {
  const items = [];
  const gain = p.techs?.[0]?.gain;
  if (gain) items.push([t('s_gain'), gain]);
  if (p.dim) items.push([t('kl_size'), `${p.dim} mm`]);
  const cx = shortCx(p);
  if (cx) items.push([t('s_conn'), cx]);
  else if ((p.conn || []).length) items.push([t('s_conn'), p.conn.join(', ')]);
  else if (p.mount) items.push([t('s_mount'), p.mount]);
  if (p.ip) items.push([t('s_ip'), p.ip]);
  if (p.lna) items.push([t('s_lna'), fmtLna(p.lna), 'lna']);
  return `<dl class="keys">${items.map(([k, v, c]) => `<div class="${c || ''}"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
}
/** 連接器＋線材的精簡寫法 (清單用)：IPEX MHF1 + RF1.13 (Φ1.13), 100 mm；多條線時加註 +N */
function shortCx(p) {
  if (!connCableInfo(p)) return '';
  const cab = p.cables[0];
  const c = (p.conn || [])[0] || '';
  const d = (String(cab.type || '').match(/^RF\s*(\d+(?:\.\d+)?)/i) || [])[1];
  const more = p.cables.length > 1 ? ` +${p.cables.length - 1}` : '';
  return `${c} + ${cab.type}${d ? ` (Φ${d})` : ''}, ${cab.len} mm${more}`;
}

function specCells(p) {

/** 比較語意化版本：a > b 回傳正數 */
function cmpVer(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
  return 0;
}
/** 讀取伺服器上的 version.json (不經快取)；失敗回傳 null */
async function fetchLatest() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    return j.version ? j : null;
  } catch { return null; }
}
async function checkForUpdate() {
  if (MODE !== 'app') return null;
  const latest = await fetchLatest();
  const has = !!latest && cmpVer(latest.version, APP_VERSION) > 0;
  $('verBtn').classList.toggle('has-update', has);   // 有新版本：版本按鈕顯示紅點 (點開即可強制更新)
  if (has) toast(t('newVersion', { v: latest.version }), 5000);
  return latest;
}
async function openVersion() {
  const swActive = !!navigator.serviceWorker?.controller;
  const render = (latestTxt) => {
    $('verDialog').innerHTML = `
      <div class="d-simple-head"><h2 id="verTitle">${esc(t('verTitle'))}</h2>
        <button type="button" class="icon-btn" data-close>${esc(t('close'))}</button></div>
      <div class="d-body">
        <dl class="ver-grid">
          <dt>${esc(t('v_app'))}</dt><dd>v${esc(APP_VERSION)}</dd>
          <dt>${esc(t('v_latest'))}</dt><dd id="verLatest">${latestTxt}</dd>
          <dt>${esc(t('v_built'))}</dt><dd>${esc(DATA.built || '—')}</dd>
          <dt>${esc(t('v_sw'))}</dt><dd>${esc(t(swActive ? 'swOn' : 'swOff'))}</dd>
          <dt>${esc(t('v_mode'))}</dt><dd>${esc(t(isStandalone() ? 'modeApp' : 'modeBrowser'))}</dd>
          <dt>${esc(t('v_storage'))}</dt><dd>${esc(t(persisted ? 'persistOn' : 'persistOff'))}</dd>
          <dt>${esc(t('v_src'))}</dt><dd>${esc(DATA.source)}</dd>
          <dt>${esc(t('v_rev'))}</dt><dd>${esc([DATA.revision?.rev, DATA.revision?.date].filter(Boolean).join(' · ') || '—')}</dd>
          <dt>${esc(t('v_count'))}</dt><dd>${esc(t('v_countVal', { a: DATA.items.length, m: DATA.modules.length, c: DATA.items.reduce((n, p) => n + (p.certs || []).length, 0) }))}</dd>
        </dl>
        <button type="button" class="icon-btn" data-force>${esc(t('update'))}</button>
      </div>`;
  };
  render(esc(t('checking')));
  if (!$('verDialog').open) $('verDialog').showModal();
  const latest = await checkForUpdate();

  if (!latest) el.textContent = t('cantCheck');
  else if (cmpVer(latest.version, APP_VERSION) > 0) el.innerHTML = `<b class="ok">${esc(t('newer', { v: latest.version }))}</b>`;
  else el.textContent = t('upToDate', { v: latest.version });
}
/**
 * 強制更新：
 * 1. 請等待中的新版 Service Worker 立即啟用
 * 2. 解除註冊所有 Service Worker、刪除所有 Cache Storage
 * 3. 以帶時間戳記的網址重新載入，繞過 HTTP 快取
 */
async function forceUpdate() {
  // 離線或伺服器無回應時絕不清除快取，否則 App 將無法開啟
  if (!navigator.onLine) { toast(t('offlineNoUpdate'), 3500); return; }
  const btn = document.querySelector('[data-force]');
  btn?.classList.add('spin');
  const latest = await fetchLatest();
  if (!latest && location.protocol !== 'file:') {
    btn?.classList.remove('spin');
    toast(t('serverUnreachable'), 3500);
    return;
  }
  toast(t('updating'));
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      regs.forEach((r) => r.waiting?.postMessage('SKIP_WAITING'));
      await Promise.all(regs.map((r) => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch { /* 部分環境不允許存取，仍繼續重新載入 */ }
  const url = new URL(location.href);
  url.searchParams.set('v', Date.now());
  setTimeout(() => location.replace(url.toString()), 400);
}

const ICON_SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const isDark = () => (document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === 'dark'
  : matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(th) {
  if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
  renderThemeBtn();
}
/** 手機最上方狀態列 / 瀏覽器列的顏色 = 目前主題的背景色 (深色模式時跟著變深)
 *  所有 theme-color 標籤一律更新 content (不刪除)：瀏覽器無論讀哪一個都是目前主題的顏色 */
function syncThemeColor() {
  const dark = isDark();
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || (dark ? '#12191E' : '#F3F0E9');
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', bg));
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
}
function renderThemeBtn() {
  syncThemeColor();
  const dark = isDark();
  // 按鈕顯示「切換目標」
  $('themeIcon').innerHTML = dark ? ICON_SUN : ICON_MOON;
  $('themeLbl').textContent = t(dark ? 'themeLight' : 'themeDark');
  $('themeBtn').setAttribute('aria-label', t(dark ? 'themeAriaLight' : 'themeAriaDark'));
}

   ========================================================================== */
function toast(msg, ms = 1800) {
  const el = $('toast');
  if (!el || MODE !== 'app') return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms);
}
async function copyText(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch { toast(t('clipFail')); }
    ta.remove();
  }
}
function update() { shown = PAGE_SIZE; renderAll(); }


$('quick').addEventListener('change', (e) => {
  const key = e.target.dataset.quick; if (!key) return;
  if (key === '__module') {
    const v = e.target.value;
    if (v && !(state.modules || []).includes(v)) state.modules = [...(state.modules || []), v];
  } else state.sel[key] = e.target.value ? [e.target.value] : [];
  if (key === 'type' && !isGnss()) state.sel.atype = [];
  if (key === 'jp' && !isJpYes()) state.modules = [];
  update();
});
// 移除已選的 TELEC 認證模組 (標籤上的 ×)
$('quick').addEventListener('click', (e) => {
  const b = e.target.closest('[data-rm-mod]'); if (!b) return;
  e.preventDefault();
  state.modules = (state.modules || []).filter((m) => m !== b.dataset.rmMod);
  update();
});

let qTimer;
$('q').addEventListener('input', (e) => {
  state.q = e.target.value;
  clearTimeout(qTimer); qTimer = setTimeout(update, 150);
});
$('filterBody').addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    state.q = e.target.value;
    clearTimeout(qTimer); qTimer = setTimeout(update, 150);
  } else if (e.target.id === 'maxL') {
    const v = parseFloat(e.target.value);
    state.maxL = isFinite(v) && v > 0 ? v : null;
    clearTimeout(qTimer); qTimer = setTimeout(update, 250);
  }
});
$('filterBody').addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.toggle) { state.toggles[el.dataset.toggle] = el.checked; update(); return; }
  if (el.dataset.facet && el.type === 'checkbox') toggleSel(el.dataset.facet, el.dataset.val);
});
$('filterBody').addEventListener('click', (e) => {
  const c = e.target.closest('button.chip'); if (c) toggleSel(c.dataset.facet, c.dataset.val);
});
function toggleSel(key, val) {
  const cur = state.sel[key] || [];
  state.sel[key] = cur.includes(val) ? cur.filter((v) => v !== val) : cur.concat(val);
  update();
}
$('activeTags').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tag]'); if (!b) return;
  const x = JSON.parse(b.dataset.tag);
  if (x.act === 'module') state.modules = (state.modules || []).filter((m) => m !== x.m);
  if (x.act === 'facet') state.sel[x.f] = (state.sel[x.f] || []).filter((v) => v !== x.v);
  if (x.act === 'size') state.maxL = null;
  update();
});
function resetAll() { state = freshState(page); $('sortSel').value = state.sort; update(); }
$('resetBtn').addEventListener('click', resetAll);

$('copyBtn').addEventListener('click', () => {

$('list').addEventListener('click', (e) => {
  if (e.target.closest('[data-act="reset"]')) { resetAll(); return; }
  const ph = e.target.closest('[data-photo]');
  if (ph) { e.stopPropagation(); openPhoto(ph.dataset.photo); return; }
  const cb = e.target.closest('[data-cmp]');
  if (cb) { e.stopPropagation(); toggleCmp(cb.dataset.cmp); return; }
  const ds = e.target.closest('[data-ds]');
  if (ds) { e.stopPropagation(); openDatasheet(ds.dataset.ds); return; }
  const r = e.target.closest('[data-oc]'); if (r) openDetail(r.dataset.oc);
});
// 鍵盤：在列上按 Enter / 空白鍵開啟詳細規格
$('list').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('row')) {
    e.preventDefault(); openDetail(e.target.dataset.oc);
  }
});
$('detail').addEventListener('click', (e) => {
  if (e.target === $('detail') || e.target.closest('[data-close]')) { $('detail').close(); return; }
  const ph = e.target.closest('[data-photo]'); if (ph) { openPhoto(ph.dataset.photo); return; }
  const c = e.target.closest('[data-copy]'); if (c) { copyText(c.dataset.copy, t('copied', { oc: c.dataset.copy })); return; }
  const ds = e.target.closest('[data-ds]'); if (ds) { openDatasheet(ds.dataset.ds); return; }
  const g = e.target.closest('[data-goto]');
  if (g) {
    const oc = g.dataset.goto;
    if (PAGES[page].items().some((x) => x.oc === oc)) openDetail(oc);
    else { $('detail').close(); state.q = oc; update(); toast(t('notOnPage')); }
  }
});
$('verDialog').addEventListener('click', (e) => {

});

  const ph = e.target.closest('[data-photo]'); if (ph) { openPhoto(ph.dataset.photo); return; }

function setMenu(open) {

}
$('menuBtn').addEventListener('click', (e) => { e.stopPropagation(); setMenu($('toolMenu').hidden); });

let scrim;

  $('filters').classList.toggle('open', open);

/** 從目前資料挑選示範用的模組與天線 (Excel 更新後自動改用仍存在的料號) */
function guidePicks() {
  const items = DATA.items;
  const isRg = (p) => (p.cables || []).length === 1 && RG174_RE.test(p.cables[0].type || '');
  const isIpex = (p) => (p.conn || []).some((c) => IPEX_RE.test(c));
  const module = [...DATA.modules].sort((a, b) => b.n - a.n)[0]?.name || '';
  const cert = [...items].filter((p) => (p.certs || []).length && connCableInfo(p))
    .sort((a, b) => b.certs.length - a.certs.length)[0]
    || [...items].filter((p) => (p.certs || []).length).sort((a, b) => b.certs.length - a.certs.length)[0];
  const active = items.find((p) => p.lna && p.type === 'GNSS' && isRg(p))
    || items.find((p) => p.lna && connCableInfo(p)) || items.find((p) => p.lna);
  const exRg = items.find(isRg);
  const exIpex = items.find(isIpex);
  return { module, cert: cert?.oc, active: active?.oc,
           exRg: exRg ? connCableInfo(exRg) : '', exIpex: exIpex ? connCableInfo(exIpex) : '' };
}

/** 標註：在元素外框加上編號 (dialog 開啟時放在 dialog 內才會顯示在最上層) */
function drawCallouts(items) {
  for (const [sel, n, dx, dy, pad = 3] of items) {
    const els = Array.isArray(sel) ? sel.flatMap((x) => [...document.querySelectorAll(x)]) : [document.querySelector(sel)].filter(Boolean);
    if (!els.length) continue;
    const rs = els.map((e) => e.getBoundingClientRect());
    const r = { left: Math.min(...rs.map((x) => x.left)), top: Math.min(...rs.map((x) => x.top)),
                right: Math.max(...rs.map((x) => x.right)), bottom: Math.max(...rs.map((x) => x.bottom)) };
    const host = document.querySelector('dialog[open]') || document.body;
    const box = document.createElement('div');
    box.className = 'g-co-box';
    Object.assign(box.style, { left: (r.left - pad) + 'px', top: (r.top - pad) + 'px',
      width: (r.right - r.left + 2 * pad) + 'px', height: (r.bottom - r.top + 2 * pad) + 'px' });
    const num = document.createElement('div');
    num.className = 'g-co-num';
    num.textContent = n;
    const left = dx === 'right' ? r.right + 4 : dx === 'inR' ? r.right - 26 : r.left + dx;
    Object.assign(num.style, { left: left + 'px', top: (r.top + dy) + 'px' });
    host.append(box, num);
  }
}

    .g-co-box{position:fixed;border:2px solid #A6332B;border-radius:8px;z-index:9998;pointer-events:none}
    .g-co-num{position:fixed;width:22px;height:22px;border-radius:50%;background:#A6332B;color:#fff;font:700 13px/22px -apple-system,sans-serif;
      text-align:center;z-index:9999;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.35)}
    #detail .d-body h3{display:inline-block;padding-right:2px} #detail .d-actions{width:fit-content}
    ${name === 'install' ? '' : '#installBtn{display:none!important}'}`;
  document.head.appendChild(css);
  const pick = guidePicks();
  const toQuick = () => {
    if (!isDesktop()) { setFilters(true); $('filters').scrollTop = 0; return; }   // 手機：下拉選單在底部篩選面板內
    window.scrollTo(0, $('quick').getBoundingClientRect().top + scrollY - 118);
  };
  const sel = (k) => `.quick label:has(select[data-quick="${k}"])`;
  if (name === 'menusA') {
    state.sel.jp = ['Yes']; state.modules = [pick.module]; update(); await nextFrame(); toQuick(); await nextFrame();
    drawCallouts([[sel('type'), '1', 'inR', -12], [sel('jp'), '2', 'inR', -12],
      [['.quick label.module', '.module-info'], '3', 'inR', -12], [sel('ptype'), '5', 'inR', -12], [sel('form'), '6', 'inR', -12]]);
  } else if (name === 'menusB') {
    state.sel.type = ['GNSS']; update(); await nextFrame(); toQuick(); await nextFrame();
    drawCallouts([[sel('type'), '1', 'inR', -12], [sel('atype'), '4', 'inR', -12]]);
  } else if (name === 'detailA' && pick.cert) {
    openDetail(pick.cert); await nextFrame();
    drawCallouts([['#detail .d-actions', '1', 'right', 6], ['#detail .d-body section:nth-of-type(1) h3', '2', 'right', -3, 2]]);
  } else if (name === 'detailB' && pick.active) {
    openDetail(pick.active); await nextFrame();
    const d = $('detail');
    const rf = d.querySelector('.lna-line')?.closest('section');
    if (rf) d.scrollTop = rf.offsetTop - 12;
    for (const dt of d.querySelectorAll('.kv dt')) if (dt.textContent === t('k_cx')) dt.parentElement.id = 'cxItem';
    await nextFrame();
    drawCallouts([['#detail .lna-line', '3', 'right', -4], ['#cxItem', '4', 'inR', -12]]);
  } else if (name === 'install') {
    openInstallHelp(); await nextFrame();
  }
  if (parent !== window) parent.postMessage({ type: 'guide-embed-ready', name }, location.origin);
}

/** guide 模式：產生使用說明頁 */
function renderGuide() {
  const g = GUIDE[lang] || GUIDE.en;
  const fill = (str, v) => String(str).replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  const pick = guidePicks();
  const rev = DATA.revision || {};
  const built = String(DATA.built || '').slice(0, 10);
  const W = 210, H = Math.round(W * 772 / 393), SC = W / 393;   // iPhone 畫面：393×772 縮放
  const statusIcons = `<svg viewBox="0 0 18 12" class="sig"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg><svg viewBox="0 0 16 12" class="wifi"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.3C13.4 1.4 10.8.4 8 .4S2.6 1.4.5 3.4l1.2 1.3C3.4 3.1 5.6 2.2 8 2.2zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.2-1.3C11.6 4.7 9.9 4 8 4s-3.6.7-4.9 1.9l1.2 1.3c1-.9 2.3-1.4 3.7-1.4zm0 3.6c.5 0 1 .2 1.3.5L8 11.6 6.7 9.9c.3-.3.8-.5 1.3-.5z"/></svg><svg viewBox="0 0 27 12" class="bat"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="19" height="8" rx="1.8"/><rect x="24" y="4" width="2" height="4" rx="1" opacity=".45"/></svg>`;
  const phone = (stateName, label) => `<figure class="g-phone">${label ? `<figcaption>${esc(label)}</figcaption>` : ''}
    <div class="g-frame"><div class="g-screen">
      <div class="g-status"><span>9:41</span><span class="g-island"></span><span class="g-icons">${statusIcons}</span></div>
      <div class="g-view" style="width:${W}px;height:${H}px"><iframe src="${location.pathname}?embed=${stateName}&lang=${lang}" style="transform:scale(${SC})" tabindex="-1" aria-hidden="true" title=""></iframe></div>
      <div class="g-home"><i></i></div>
    </div></div></figure>`;
  const legend = (arr, cls = '', start = 1) => `<ol class="g-legend ${cls}">${arr.map((x, i) => `<li><span class="g-num">${i + start}</span><span>${x}</span></li>`).join('')}</ol>`;
  const tags = [`<span class="g-tag cert">TELEC ×10</span>`, `<span class="g-tag jp">${esc(t('badgeJp'))}</span>`,
    `<span class="g-tag ds">Datasheet</span>`, `<b class="g-acc">${g.lna_tag}</b>`, `<b>${g.cx_tag}</b>`];
  const means = [...g.lab, g.lna_mean, fill(g.cx_mean, { ex1: esc(pick.exRg), ex2: esc(pick.exIpex) })];
  const devs = ['iPhone / iPad', 'Android', 'Windows / Mac'];
  const callout = fill(g.callout, { open: `<span class="g-tag btn">${esc(t('openWeb'))}</span>`, copy: `<span class="g-tag btn2">${esc(t('copyLink'))}</span>` });
  const foot = `<div class="g-foot">${g.footer} · v${esc(APP_VERSION)}</div>`;

  const html = `
  <div class="g-page">
    <div class="g-hero"><div><h1>${g.title}</h1><div class="g-sub">${g.sub}</div></div>
      <div class="g-meta">${esc(fill(g.meta[0], { v: APP_VERSION }))}<br>${esc(fill(g.meta[1], { r: rev.rev || '—', d: rev.date || '—' }))}<br>${esc(built)}</div></div>
    <p class="g-lead">${fill(g.lead, { a: DATA.items.length, m: DATA.modules.length })}</p>
    <div class="g-url"><b>${g.url}</b><code>${esc(appUrl() || location.href.split('?')[0])}</code></div>
    <p class="g-agent">${fill(g.agent, { agent: esc(t('agent')), title: esc(t('mTitle')) })}</p>
    <section><h2><span class="g-no">01</span>${g.h01}</h2>
      <div class="g-pair">${phone('menusA', g.S1)}${phone('menusB', g.S2)}</div>
      ${legend(g.M, 'g-cols3')}<p class="g-tip">${g.tip}</p></section>
    ${foot}
  </div>
  <div class="g-page">
    <section><h2><span class="g-no">02</span>${g.h02}</h2>
      <div class="g-pair">${phone('detailA', g.P1)}${phone('detailB', g.P2)}</div>
      ${legend(g.D, 'g-cols2')}
      <h3>${g.labels}</h3>
      <div class="g-tbl"><table><tr><th style="width:150px">${g.th_label}</th><th>${g.th_mean}</th></tr>
        ${tags.map((tg, i) => `<tr><td>${tg}</td><td>${means[i]}</td></tr>`).join('')}</table></div></section>
    ${foot}
  </div>
  <div class="g-page">
    <section><h2><span class="g-no">03</span>${g.h03}</h2>
      <div class="g-side">${phone('install', '')}
        <div class="g-body">
          <div class="g-tbl"><table><tr><th style="width:100px">${g.th_dev}</th><th>${g.th_how}</th></tr>
            ${devs.map((d, i) => `<tr><td>${d}</td><td>${g.inst[i]}</td></tr>`).join('')}</table></div>
          <div class="g-callout">${callout}</div>
          <p>${g.offline}</p><p class="g-muted">${g.ios_note}</p>
        </div></div></section>
    <section><h2><span class="g-no">04</span>${g.h04}</h2>
      <dl class="g-faq">${g.faq.map(([q, a]) => `<div><dt>${q}</dt><dd>${a}</dd></div>`).join('')}</dl></section>

    ${foot}
  </div>`;

  document.title = `${g.title} — ${g.sub}`;
  document.body.className = 'g-body-root';
  document.body.innerHTML = `<style>${GUIDE_CSS}</style>${html}`;

  // 等待所有 iPhone 畫面完成後才允許列印 (逾時 15 秒仍放行)
  let pending = document.querySelectorAll('.g-view iframe').length;
  const done = () => {
    if (window.__guideReady) return;
    window.__guideReady = true;
    if (parent !== window) parent.postMessage({ type: 'guide-ready' }, location.origin);
  };
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || e.data?.type !== 'guide-embed-ready') return;
    if (--pending <= 0) setTimeout(done, 150);
  });
  setTimeout(done, 15000);
}
